<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkpoint</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --text:#e8eaee; --muted:#8b919c; --accent:#7aa2ff;
          --red:#ff5c5c; --amber:#ffb547; --green:#3ecf8e; --mono:13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Inter", "Segoe UI", sans-serif; min-height:100vh; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  kbd { font:600 12px ui-monospace, monospace; background:#20242d; border-radius:6px; padding:3px 8px; color:var(--muted); }
  .muted { color:var(--muted); }
  .kicker { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--c, var(--accent)); font-weight:600; }
  .btn { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:600 13px -apple-system, sans-serif; cursor:pointer; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:#4a5060; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.on.good { background:var(--green); border-color:var(--green); color:#000; }
  .btn.on.warn { background:var(--amber); border-color:var(--amber); color:#000; }
  .btn.on.bad { background:var(--red); border-color:var(--red); color:#000; }
  .btn.on.pick { background:var(--accent); border-color:var(--accent); color:#000; }
  input.own { width:100%; background:transparent; border:1px dashed var(--line); border-radius:10px; padding:11px 14px; color:var(--text); font:inherit; font-size:15px; }
  input.own:focus { outline:none; border-color:var(--accent); border-style:solid; }
  .note { font-size:13px; color:var(--amber); }

  /* evidence (one click away) */
  .ev { margin-top:12px; background:#13161c; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; display:grid; gap:10px; }
  .ev .row { display:grid; grid-template-columns:110px 1fr; gap:10px; }
  .ev .k { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding-top:2px; }
  .ev .exp { color:var(--green); } .ev .act { color:var(--red); }
  .ev .sd { font:var(--mono); white-space:pre; }
  .ev .sd .add { color:#a8f0cf; } .ev .sd .del { color:#ffb0b0; }
  .tog { background:none; border:0; color:var(--muted); font:13px -apple-system, sans-serif; cursor:pointer; padding:0; }
  .tog:hover { color:var(--text); }

  /* layout: one item at a time + sidebar */
  .wrap { display:grid; grid-template-columns:1fr 300px; min-height:100vh; }
  main { padding:40px 56px 170px; max-width:820px; }
  h1 { font-size:32px; line-height:1.2; margin:10px 0 12px; }
  .meta { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .why { font-size:17px; color:#c4c8d0; margin:0 0 22px; }
  .opts { display:grid; gap:10px; }
  .opt { display:flex; gap:14px; align-items:center; padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--card); cursor:pointer; font:inherit; color:inherit; text-align:left; width:100%; }
  .opt:hover:not(:disabled) { border-color:#4a5060; }
  .opt:disabled { opacity:.4; cursor:not-allowed; }
  .opt .tag { margin-left:auto; font-size:12px; color:var(--accent); }
  .opt .lock { margin-left:auto; font-size:12px; color:var(--amber); }
  .opt.sel { border-color:var(--accent); background:rgba(122,162,255,.1); } .opt.sel kbd { background:var(--accent); color:#000; }
  .dec { border:1px dashed var(--amber); border-radius:12px; padding:14px 18px; margin:0 0 18px; }
  .dec .t { font-size:16px; margin:4px 0 10px; }
  .dec .b { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .own { margin-top:10px; }
  .bundle { color:var(--muted); font-size:15px; margin:0 0 22px; padding-left:18px; }
  aside { border-left:1px solid var(--line); padding:28px 20px 170px; font-size:14px; }
  aside .title { color:var(--muted); font-size:13px; margin-bottom:14px; }
  aside ul { padding:0; margin:0; }
  aside li { list-style:none; padding:8px; border-radius:8px; cursor:pointer; display:flex; gap:8px; }
  aside li.cur { background:var(--card); }
  aside li .d { flex:none; width:8px; height:8px; border-radius:50%; margin-top:7px; }
  aside li .s { margin-left:auto; color:var(--accent); font:600 12px ui-monospace, monospace; white-space:nowrap; }
  .keys { color:var(--muted); font-size:13px; margin-top:22px; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } main { padding:28px 20px 40px; } aside { border-left:0; border-top:1px solid var(--line); } }

  footer { position:fixed; left:0; right:0; bottom:0; background:#0b0c10ee; border-top:1px solid var(--line); padding:14px 40px; display:flex; gap:16px; align-items:center; backdrop-filter:blur(6px); z-index:5; }
  @media (max-width:900px) { footer { padding:12px 18px; flex-wrap:wrap; } }
  footer code { font:14px ui-monospace, monospace; color:var(--accent); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:200px; }
  footer button { background:var(--accent); color:#000; border:0; border-radius:8px; padding:9px 16px; font:600 14px -apple-system, sans-serif; cursor:pointer; }
  footer #cnt { color:var(--muted); font-size:13px; white-space:nowrap; }
  footer #flag { font-size:13px; white-space:nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<footer><span id="cnt"></span><code id="ans"></code><span id="flag"></span><button id="copy">Copy answers</button></footer>

<script>
/* Rendered from a checkpoint.yaml (its fields: checkpoint.example.yaml beside this file) by
 * scripts/render.mjs, which validates the YAML and writes it as JSON in place of the marker. */
const DATA = /*DATA*/null/*/DATA*/;
</script>
<script>
  if (!DATA) { document.body.innerHTML = '<p style="padding:32px;font:15px/1.5 sans-serif">Render with scripts/render.mjs: <code>node scripts/render.mjs checkpoint.yaml</code></p>'; throw new Error('Render with scripts/render.mjs'); }
  const L = 'abcd';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const S = DATA.slices;

  /* ---------- derived model: what needs the user ---------- */
  const norm = l => l.trim().replace(/\s+/g, ' ');
  function shapeDiff(s) {
    if (!s.built) return [];
    const out = [];
    ['files', 'calls'].forEach(k => {
      const P = (s.planned[k] || []).map(norm), B = (s.built[k] || []).map(norm);
      B.forEach(l => { if (!P.includes(l)) out.push({ op: '+', t: l }); });
      P.forEach(l => { if (!B.includes(l)) out.push({ op: '−', t: l }); });
    });
    return out;
  }
  const explainedBy = (s, line) => (s.decisions || []).find(d => (d.explains || []).some(x => line.t.includes(x)));
  const atCp = S.filter(s => s.state === 'checkpoint');
  const blocked = S.filter(s => s.state === 'blocked');
  // every accept/reject-able thing: decisions, plus shape lines no decision explains
  const DECS = [];
  atCp.forEach(s => {
    (s.decisions || []).forEach(d => DECS.push({ id: d.id, s, text: d.text, why: d.why, shape: shapeDiff(s).filter(l => explainedBy(s, l) === d) }));
    const loose = shapeDiff(s).filter(l => !explainedBy(s, l));
    if (loose.length) DECS.push({ id: 'shape' + s.n, s, text: `S${s.n}'s shape differs from the plan`, why: 'No decision in the report explains it.', shape: loose });
  });
  const decsOf = s => DECS.filter(d => d.s === s);
  const broken = s => (s.flows || []).filter(f => f.state === 'broken');
  const unwalkable = s => (s.flows || []).filter(f => f.state === 'unwalkable');
  const matches = s => s.status === 'Done' && !decsOf(s).length && (s.flows || []).every(f => f.state === 'proved');
  const clean = atCp.filter(matches);
  const messy = atCp.filter(s => !matches(s));

  /* ---------- state ---------- */
  let st;
  const key = () => 'checkpoint:' + DATA.id;
  const load = () => { st = Object.assign({ pr: {}, fb: {}, q: {}, dec: {}, open: {}, cur: 0 }, JSON.parse(localStorage.getItem(key()) || '{}')); };
  const save = () => localStorage.setItem(key(), JSON.stringify(st));
  // Pass is allowed only when every decision on the PR is explicitly accepted.
  const passBlock = s => {
    const d = decsOf(s);
    const rej = d.filter(x => st.dec[x.id] === 'reject');
    if (rej.length) return `${rej.map(x => x.id).join(', ')} rejected, so S${s.n} gets reworked`;
    const und = d.filter(x => !st.dec[x.id]);
    return und.length ? `Decide ${und.map(x => x.id).join(', ')} first` : '';
  };
  function setDec(id, v) {
    st.dec[id] = st.dec[id] === v ? undefined : v;
    const d = DECS.find(x => x.id === id);
    if (st.dec[id] === 'reject' && st.pr[d.s.n] === 'pass') st.pr[d.s.n] = undefined;
    save(); draw();
  }
  function passAll(on) { clean.forEach(s => st.pr[s.n] = on ? 'pass' : undefined); }
  const allPassed = () => clean.length && clean.every(s => st.pr[s.n] === 'pass');

  /* ---------- answer block ----------
   * pass 1 3   rework 2: "feedback"   q4b | q4: "own answer"   accept D1 shape2   reject D3
   */
  const quote = t => '"' + String(t).replace(/"/g, "'").replace(/\s+/g, ' ').trim() + '"';
  function answer() {
    const parts = [];
    const pass = S.filter(s => st.pr[s.n] === 'pass').map(s => s.n);
    if (pass.length) parts.push('pass ' + pass.join(' '));
    S.filter(s => st.pr[s.n] === 'rework').forEach(s => {
      const fb = (st.fb[s.n] || '').trim();
      parts.push(fb ? `rework ${s.n}: ${quote(fb)}` : `rework ${s.n}`);
    });
    blocked.forEach(s => {
      const q = st.q[s.n];
      if (typeof q === 'number') parts.push(`q${s.n}${L[q]}`);
      else if (q) parts.push(`q${s.n}: ${quote(q)}`);
    });
    const acc = DECS.filter(d => st.dec[d.id] === 'accept').map(d => d.id);
    const rej = DECS.filter(d => st.dec[d.id] === 'reject').map(d => d.id);
    if (acc.length) parts.push('accept ' + acc.join(' '));
    if (rej.length) parts.push('reject ' + rej.join(' '));
    return { text: parts.join('  '), acc };
  }
  // open calls: one per PR at the checkpoint, one per decision, one per question
  const calls = () => [
    ...atCp.map(s => !!st.pr[s.n] || decsOf(s).some(d => st.dec[d.id] === 'reject')),
    ...DECS.map(d => !!st.dec[d.id]),
    ...blocked.map(s => st.q[s.n] !== undefined && st.q[s.n] !== ''),
  ];
  function footer() {
    const a = answer(), c = calls();
    document.getElementById('cnt').textContent = `${c.filter(Boolean).length}/${c.length} decided`;
    document.getElementById('ans').textContent = a.text || '— nothing decided yet —';
    document.getElementById('flag').innerHTML = a.acc.length ? `<span style="color:var(--amber)">→ plan gets revised (${a.acc.join(', ')})</span>` : '';
  }
  let flashT;
  function flash(msg) {
    const f = document.getElementById('flag');
    f.innerHTML = `<span style="color:var(--red)">${esc(msg)}</span>`;
    clearTimeout(flashT); flashT = setTimeout(footer, 2200);
  }

  /* ---------- evidence (one click away) ---------- */
  const prLink = s => s.pr ? `<a href="${esc(s.pr.url)}" target="_blank">PR #${esc(s.pr.num)}</a>` : 'no PR';
  const sdHTML = lines => `<div class="sd">${lines.map(l => `<span class="${l.op === '+' ? 'add' : 'del'}">${l.op} ${esc(l.t)}</span>`).join('\n')}</div>`;
  function evidence(s, focus) {   // focus: 'flow' | 'dec:<id>' | 'q' | 'pr'
    const rows = [];
    if (focus === 'flow') broken(s).forEach(f => {
      rows.push(['Flow', esc(f.name)], ['Expected', `<span class="exp">${esc(f.expected)}</span>`], ['Got', `<span class="act">${esc(f.actual)}</span>${f.evidence ? ` · <a href="${esc(f.evidence.url)}">${esc(f.evidence.label)}</a>` : ''}`]);
    });
    if (focus && focus.startsWith('dec:')) {
      const d = DECS.find(x => x.id === focus.slice(4));
      rows.push(['Why', esc(d.why)]);
      if (d.shape.length) rows.push(['Shape vs plan', sdHTML(d.shape)]);
      rows.push(['If accepted', 'The plan is revised to include it before ' + (S.filter(x => x.state === 'waiting').map(x => 'S' + x.n).join(', ') || 'the next slice') + ' starts.']);
    }
    if (focus === 'q') rows.push(['Slice', `S${s.n} · ${esc(s.title)}`], ['Stopped in', esc(s.question.phase)]);
    if (focus === 'pr' || focus === 'flow') {
      rows.push(['Flows', (s.flows || []).map(f => `${f.state === 'proved' ? '✓' : f.state === 'broken' ? '✗' : '–'} ${esc(f.name)}${f.state === 'unwalkable' ? ' <span class="muted">(not walkable, in the QA plan)</span>' : ''}${f.evidence && f.state !== 'broken' ? ` · <a href="${esc(f.evidence.url)}">${esc(f.evidence.label)}</a>` : ''}`).join('<br>') || '<span class="muted">none reported</span>']);
      if (focus === 'pr') rows.push(['Shape', shapeDiff(s).length ? sdHTML(shapeDiff(s)) : 'Same as the plan']);
    }
    rows.push(['PR', `${prLink(s)} · S${s.n} ${esc(s.title)}`]);
    return `<div class="ev">${rows.map(([k, v]) => `<div class="row"><div class="k">${k}</div><div>${v}</div></div>`).join('')}</div>`;
  }
  const toggle = id => { st.open[id] = !st.open[id]; save(); draw(); };
  const headlineOf = s => broken(s)[0]?.headline || (s.status === 'Failed' ? `S${s.n}'s review never came clean` : decsOf(s)[0]?.text)
    || (unwalkable(s).length ? `S${s.n} could not be walked end to end` : s.title);
  const whyOf = s => broken(s)[0]?.why || decsOf(s)[0]?.why
    || (unwalkable(s).length ? `${unwalkable(s).map(f => f.name).join('; ')}: not walkable here, in the QA plan.` : '');

  /* ---------- items: one per PR that differs, one per question, one for every PR that matches ---------- */
  function items() {
    const it = [];
    messy.forEach(s => it.push({ kind: 'pr', s, color: broken(s).length || s.status === 'Failed' ? 'var(--red)' : 'var(--amber)',
      label: broken(s).length ? 'Broken flow' : decsOf(s).length ? 'Beyond the plan' : s.status }));
    blocked.forEach(s => it.push({ kind: 'q', s, color: 'var(--accent)', label: 'Worker question' }));
    if (clean.length) it.push({ kind: 'bundle', color: 'var(--green)', label: 'Matches the plan' });
    return it;
  }
  const done = i => i.kind === 'pr' ? !!st.pr[i.s.n] : i.kind === 'q' ? st.q[i.s.n] !== undefined && st.q[i.s.n] !== '' : allPassed() || st.bundleHold;
  const opts = i => i.kind === 'pr' ? [{ t: 'Rework', v: 'rework', rec: !!broken(i.s).length }, { t: broken(i.s).length ? 'Pass anyway' : 'Pass', v: 'pass', lock: passBlock(i.s) }]
    : i.kind === 'q' ? i.s.question.options.map((t, k) => ({ t, v: k, rec: k === 0 }))
    : [{ t: clean.length > 1 ? `Pass all ${clean.length}` : 'Pass', v: 'all', rec: true }, { t: 'Not now', v: 'hold' }];
  function pick(i, k) {
    const o = opts(i)[k]; if (!o) return;
    if (i.kind === 'pr') { if (o.v === 'pass' && o.lock) return flash(o.lock); st.pr[i.s.n] = o.v; }
    if (i.kind === 'q') st.q[i.s.n] = k;
    if (i.kind === 'bundle') { passAll(o.v === 'all'); st.bundleHold = o.v === 'hold'; }
    save(); draw();
    if (!(i.kind === 'pr' && o.v === 'rework')) setTimeout(() => go(st.cur + 1), 150);
  }
  function go(k) { const n = items().length; if (k >= 0 && k < n) { st.cur = k; save(); draw(); } }
  const decBox = (d, head) => `<div class="dec">${head ? `<div class="kicker" style="--c:var(--amber)">${head} · ${d.id}</div><div class="t">${esc(d.text)}</div>` : ''}<div class="b">
      <button class="btn good ${st.dec[d.id] === 'accept' ? 'on' : ''}" onclick="setDec('${d.id}','accept')"><kbd>y</kbd> Accept ${d.id} — the plan gets revised</button>
      <button class="btn bad ${st.dec[d.id] === 'reject' ? 'on' : ''}" onclick="setDec('${d.id}','reject')"><kbd>n</kbd> Reject ${d.id} — undo it in the rework</button>
      <button class="tog" onclick="toggle('A-${d.id}')">${st.open['A-' + d.id] ? 'Hide' : 'Why, and the shape'} ▾</button></div>
      ${st.open['A-' + d.id] ? evidence(d.s, 'dec:' + d.id) : ''}</div>`;
  function draw() {
    const y = scrollY;
    const it = items();
    if (!it.length) {
      document.getElementById('root').innerHTML = `<div class="wrap"><main><h1>Nothing at this checkpoint</h1></main><aside></aside></div>`;
      return footer();
    }
    st.cur = Math.max(0, Math.min(st.cur, it.length - 1));
    const i = it[st.cur];
    const sel = k => {
      const o = opts(i)[k];
      if (i.kind === 'pr') return st.pr[i.s.n] === o.v;
      if (i.kind === 'q') return st.q[i.s.n] === k;
      return o.v === 'all' ? allPassed() : !!st.bundleHold && !allPassed();
    };
    let head, why, extra = '', meta = '';
    if (i.kind === 'pr') {
      head = headlineOf(i.s); why = whyOf(i.s);
      meta = `S${i.s.n} · ${esc(i.s.title)} · ${prLink(i.s)}`;
      // the headline is the first decision only when nothing is broken; every other decision gets its own box
      const headIsDec = !broken(i.s).length && i.s.status !== 'Failed';
      extra = decsOf(i.s).map((d, k) => decBox(d, headIsDec && k === 0 ? '' : 'Also decided beyond the plan')).join('');
    } else if (i.kind === 'q') {
      head = i.s.question.text; why = i.s.question.why;
      meta = `S${i.s.n} · ${esc(i.s.title)} · no PR yet`;
    } else {
      head = clean.length > 1 ? `${clean.length} PRs match the plan — pass all` : `S${clean[0].n} matches the plan — pass it`;
      why = 'Built as planned, every flow proved.';
      extra = `<div class="bundle">${clean.map(s => `<div>S${s.n} · ${esc(s.title)} · ${prLink(s)}</div>`).join('')}</div>`;
    }
    const evKey = 'A-ev-' + st.cur;
    const evFocus = i.kind === 'pr' ? (broken(i.s).length ? 'flow' : 'pr') : i.kind === 'q' ? 'q' : null;
    const own = i.kind === 'pr' && st.pr[i.s.n] === 'rework'
      ? `<input class="own" id="fbA" placeholder="What should change? (optional; the broken flow goes along anyway) Enter ↵" value="${esc(st.fb[i.s.n] || '')}">`
      : i.kind === 'q' ? `<input class="own" id="qA" placeholder="Or type your own answer… (Enter)" value="${typeof st.q[i.s.n] === 'string' ? esc(st.q[i.s.n]) : ''}">` : '';
    document.getElementById('root').innerHTML = `<div class="wrap"><main>
      <div class="kicker" style="--c:${i.color}">${st.cur + 1} of ${it.length} · ${esc(i.label)}</div>
      <h1>${esc(head)}</h1>${meta ? `<div class="meta">${meta}</div>` : ''}
      <p class="why">${esc(why)}</p>
      ${extra}
      <div class="opts">${opts(i).map((o, k) => `<button class="opt ${sel(k) ? 'sel' : ''}" ${o.lock ? 'aria-disabled="true"' : ''} style="${o.lock ? 'opacity:.45' : ''}" onclick="pick(items()[st.cur],${k})">
        <kbd>${L[k]}</kbd>${esc(o.t)}${o.lock ? `<span class="lock">${esc(o.lock)}</span>` : o.rec ? '<span class="tag">recommended</span>' : ''}</button>`).join('')}</div>
      ${own ? `<div class="own">${own}</div>` : ''}
      ${evFocus ? `<div style="margin-top:18px"><button class="tog" onclick="toggle('${evKey}')"><kbd>e</kbd> ${st.open[evKey] ? 'Hide evidence' : 'Show evidence'}</button>${st.open[evKey] ? evidence(i.s, evFocus) : ''}</div>` : ''}
      <div class="keys"><kbd>a</kbd>–<kbd>d</kbd> choose · <kbd>y</kbd>/<kbd>n</kbd> accept / reject a decision · <kbd>e</kbd> evidence · <kbd>↑</kbd><kbd>↓</kbd> items</div>
    </main><aside><div class="title">${esc(DATA.title)} · <a href="${esc(DATA.issue.url)}" target="_blank">${esc(DATA.issue.ref)}</a> · checkpoint after stack ${esc(DATA.checkpoint.stack)}</div><ul>
      ${it.map((x, k) => `<li class="${k === st.cur ? 'cur' : ''}" onclick="go(${k})"><span class="d" style="background:${x.color}"></span>
        <span style="${done(x) ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(x.kind === 'bundle' ? `${clean.length} PR${clean.length > 1 ? 's match' : ' matches'} the plan` : x.kind === 'q' ? x.s.question.text : headlineOf(x.s))}</span>
        <span class="s">${label(x)}</span></li>`).join('')}</ul></aside></div>`;
    const fb = document.getElementById('fbA');
    if (fb) { fb.oninput = () => { st.fb[i.s.n] = fb.value; save(); footer(); }; fb.onkeydown = e => { if (e.key === 'Enter') go(st.cur + 1); }; }
    const q = document.getElementById('qA');
    if (q) q.onkeydown = e => { if (e.key === 'Enter') { st.q[i.s.n] = q.value; save(); go(st.cur + 1); draw(); } };
    scrollTo(0, y);
    footer();
  }
  function label(x) {
    if (x.kind === 'pr') { const d = decsOf(x.s).map(d => st.dec[d.id] ? (st.dec[d.id] === 'accept' ? '+' : '−') + d.id : '').join(''); return (st.pr[x.s.n] || '') + (d ? ' ' + d : ''); }
    if (x.kind === 'q') { const q = st.q[x.s.n]; return typeof q === 'number' ? 'q' + x.s.n + L[q] : q ? '✎' : ''; }
    return allPassed() ? 'pass' : '';
  }

  /* ---------- frame ---------- */
  document.getElementById('copy').onclick = e => {
    navigator.clipboard.writeText(answer().text);
    e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy answers', 1200);
  };
  addEventListener('keydown', e => {
    const t = e.target;
    if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = items()[st.cur]; if (!i) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); return go(st.cur + 1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); return go(st.cur - 1); }
    if (e.key === 'e') return toggle('A-ev-' + st.cur);
    const d = i.kind === 'pr' ? decsOf(i.s).find(x => !st.dec[x.id]) || decsOf(i.s)[0] : null;
    if (d && e.key === 'y') return setDec(d.id, 'accept');
    if (d && e.key === 'n') return setDec(d.id, 'reject');
    const k = L.indexOf(e.key);
    if (k >= 0 && k < opts(i).length) pick(i, k);
  });
  load();
  document.title = `Checkpoint · ${DATA.title}`;
  draw();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --text:#e8eaee; --muted:#8b919c; --accent:#7aa2ff; --bad:#ff5c5c; --warn:#ffb547; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Inter", "Segoe UI", sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  main { max-width:1380px; margin:0 auto; padding:36px 40px 220px; }
  @media (max-width:900px) { main { padding:24px 16px 220px; } }
  .kicker { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  h1 { font-size:30px; line-height:1.2; margin:8px 0 10px; }
  .lesson { font-size:18px; color:#c4c8d0; margin:0 0 12px; max-width:900px; }
  .lesson b { color:var(--warn); font-weight:600; }
  .meta { color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:6px 16px; margin-bottom:20px; }
  .lbl { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; border:1px solid var(--line); background:#20242d; color:#c4c8d0; white-space:nowrap; }
  .chip.own { border-color:#3a4766; color:var(--accent); background:rgba(122,162,255,.08); white-space:normal; }
  .chip.redesign { color:var(--bad); border-color:#5a2b2b; } .chip.rework { color:var(--warn); border-color:#5a4524; } .chip.friction { color:var(--muted); }
  .chip.rnd { color:var(--warn); border-color:#5a4524; background:rgba(255,181,71,.08); }
  button { font:600 13px -apple-system, sans-serif; border-radius:8px; padding:7px 14px; cursor:pointer; border:1px solid var(--line); background:#20242d; color:var(--text); }
  button:hover { border-color:#4a5060; }
  button.do.on { background:var(--ok); color:#000; border-color:var(--ok); }
  button.skip.on { background:var(--bad); color:#000; border-color:var(--bad); }
  button.cm.on { background:var(--warn); color:#000; border-color:var(--warn); }
  button.ghost { background:transparent; color:var(--muted); }
  kbd { font:600 11px ui-monospace, monospace; background:#20242d; border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--muted); }
  textarea, input.tx, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font:15px/1.55 -apple-system, sans-serif; }
  textarea { resize:vertical; }
  textarea:focus, input.tx:focus, select:focus { outline:none; border-color:var(--accent); }
  .edited { color:var(--warn); font-size:12px; text-transform:none; letter-spacing:0; margin-left:6px; }
  .hint { color:var(--muted); font-size:12px; }

  /* summary */
  .sum { display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding:12px 18px; margin:0 0 22px; border:1px solid var(--line); border-radius:12px; background:var(--card); font-size:15px; position:sticky; top:8px; z-index:3; }
  .sum b { font-size:20px; margin-right:4px; }
  .sum .s-do b { color:var(--ok); } .sum .s-skip b { color:var(--bad); } .sum .s-rev b { color:var(--warn); } .sum .s-open b { color:var(--text); }
  .sum .bar { flex:1; min-width:160px; height:6px; background:#20242d; border-radius:99px; overflow:hidden; display:flex; }
  .sum .bar i { display:block; height:100%; } .sum .bar .b-do { background:var(--ok); } .sum .bar .b-skip { background:var(--bad); opacity:.7; } .sum .bar .b-rev { background:var(--warn); }

  /* files */
  .files { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; }
  .ff { border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--card); font-size:13px; max-width:420px; }
  .ff code { font-size:12px; color:#c4c8d0; display:block; }
  .ff span { color:var(--muted); font-size:12px; } .ff b { color:var(--ok); }
  .ff.on { border-color:var(--ok); }

  /* theme pair */
  .pair { border:1px solid var(--line); border-radius:16px; background:#12151b; margin:0 0 22px; overflow:hidden; scroll-margin-top:84px; }
  .pair.cur { box-shadow:0 0 0 2px var(--accent); }
  .pair.o-do { border-color:var(--ok); } .pair.o-revise { border-color:#7a5a24; }
  .phead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  .phead .rk { font-size:26px; font-weight:700; color:var(--muted); width:36px; }
  .pair.o-do .phead .rk { color:var(--ok); }
  .phead h2 { font-size:19px; margin:0; flex:1; min-width:240px; line-height:1.3; }
  .split { display:grid; grid-template-columns:minmax(0,.9fr) 40px minmax(0,1.1fr); }
  @media (max-width:1000px) { .split { grid-template-columns:1fr; } .split .arrow { display:none; } }
  .before { padding:16px 20px; }
  .before .ql { max-height:330px; overflow:auto; padding-right:6px; }
  .bq { font-size:14.5px; line-height:1.45; color:#d4d7dd; padding:7px 0 7px 12px; border-left:3px solid #3a2b2b; margin:0 0 6px; }
  .bq .re { display:block; font-size:12px; color:var(--muted); font-style:italic; }
  .bq .rp { display:block; font-size:12.5px; color:var(--muted); margin-top:3px; }
  .bq .wh { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .arrow { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:22px; border-left:1px dashed var(--line); border-right:1px dashed var(--line); }
  .after { padding:16px 20px; background:#10141a; }
  .diff { border:1px solid #23402f; border-radius:10px; overflow:hidden; font:13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
  .diff .dh { padding:7px 12px; background:#16211b; color:#a9d8bf; border-bottom:1px solid #23402f; font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .diff .dh .k { margin-left:auto; color:var(--muted); }
  .diff pre { margin:0; padding:8px 0; white-space:pre-wrap; word-break:break-word; }
  .diff .ln { display:block; padding:0 12px 0 30px; text-indent:-18px; background:rgba(62,207,142,.07); color:#cfeedd; }
  .diff .ln::before { content:"+ "; color:var(--ok); }
  .diff textarea { border:0; border-radius:0; font:13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; background:#0d1013; min-height:140px; }
  .diff.old { border-color:#3a2f2f; opacity:.8; margin-top:8px; }
  .diff.old .dh { background:#1d1717; color:#c9a9a9; border-color:#3a2f2f; }
  .diff.old .ln { background:transparent; color:#9a9fa8; text-decoration:line-through; text-decoration-color:#5a3b3b; }
  .diff.old .ln::before { content:"  "; }
  .effect { font-size:13px; color:#c4c8d0; margin:10px 0 0; }
  .effect b { color:var(--ok); }
  .after .acts { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .after .acts .hint { margin-left:auto; }

  /* where the fix goes (edit mode) */
  .route { display:grid; grid-template-columns:170px minmax(0,1fr) minmax(0,1.3fr); gap:10px; margin:0 0 10px; }
  @media (max-width:1250px) { .route { grid-template-columns:1fr; } }
  .route label { font-size:12px; color:var(--muted); display:block; }
  .route select, .route input.tx { margin-top:4px; font-size:14px; padding:7px 10px; }
  .route input.tx { margin-top:6px; }

  /* comment */
  .cbox { margin-top:12px; border:1px solid #5a4524; border-radius:12px; background:rgba(255,181,71,.05); padding:12px 14px; }
  .cbox label { font-size:12px; color:var(--warn); display:block; margin-bottom:6px; font-weight:600; }
  .cbox textarea { min-height:64px; }
  .cbox .row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .cbox .row .hint { margin-left:auto; }
  .cbox .warn { color:var(--muted); font-size:12px; font-style:italic; }

  /* earlier rounds */
  .prev { padding:12px 20px; border-bottom:1px solid var(--line); background:rgba(255,181,71,.04); font-size:15px; }
  .prev .said { color:#e8d3ad; }
  .prev .said b { color:var(--warn); }
  .prev details { margin-top:6px; } .prev summary { cursor:pointer; color:var(--muted); font-size:13px; }

  /* folded row */
  .pair.folded { border-radius:12px; margin:0 0 8px; cursor:pointer; background:var(--card); }
  .pair.folded:hover { border-color:#4a5060; }
  .pair.folded.o-skip { opacity:.6; }
  .frow { display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap; }
  .frow .rk { font:700 16px ui-monospace, monospace; color:var(--muted); width:28px; }
  .frow h2 { font-size:16px; margin:0; flex:1; min-width:220px; font-weight:600; line-height:1.3; }
  .pair.o-skip .frow h2 { text-decoration:line-through; text-decoration-color:#5a3b3b; color:var(--muted); }
  .oc { font:700 13px -apple-system, sans-serif; padding:3px 10px; border-radius:99px; white-space:nowrap; }
  .oc.do { color:#000; background:var(--ok); } .oc.skip { color:var(--bad); border:1px solid #5a2b2b; } .oc.revise { color:#000; background:var(--warn); }
  .frow .ed { color:var(--warn); font-weight:700; }
  .frow .rt { font:12px ui-monospace, monospace; color:var(--muted); max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frow .cq { flex-basis:100%; padding-left:42px; color:#e8d3ad; font-size:13px; }
  .oc-inline { margin-left:auto; }

  /* footer */
  footer { position:fixed; left:0; right:0; bottom:0; background:#0b0c10ee; border-top:1px solid var(--line); padding:12px 40px; display:flex; gap:16px; align-items:flex-start; backdrop-filter:blur(6px); z-index:5; }
  footer pre { flex:1; margin:0; max-height:150px; overflow:auto; font:14px ui-monospace, monospace; color:var(--accent); white-space:pre-wrap; }
  footer pre:empty::before { content:attr(data-hint); color:var(--muted); }
  footer button { background:var(--accent); color:#000; border:0; }
  footer span { color:var(--muted); font-size:13px; min-width:110px; padding-top:2px; }
  @media (max-width:900px) { footer { padding:10px 16px; } }
</style>
</head>
<body>
<main id="m"></main>
<footer><span id="cnt"></span><pre id="ans"></pre><button id="copy">Copy answers</button></footer>


<script>
/* ---- Fill in DATA only. Never change the layout below. ----
 * id          unique per retro and round, e.g. "retro-ISSUE-123-r1"; keys the saved answers
 * title, date header
 * round       which round of proposals this page shows (1 = first; 2+ = after the user's comments)
 * lesson      the biggest lesson, one line (may use <b>)
 * report      path the Markdown report was saved to
 * sources     [{ ref, kind: pr|session, title, repo, url }]
 * targets     where a fix can go, for the pickers: [{ repo, note, items: [{ target, kinds: [owner kinds it suits] }] }]
 *             seeded from the owners found while routing and the repos in play
 * themes      ranked (recurrence first, then cost); n is the rank and what the answer refers to:
 *   n           number, unique
 *   headline    the lesson in plain words, as what the agent does wrong (never the comment text)

 *                  on (optional: the earlier comment this one follows up), reply (optional: what the agent answered or changed) }]
 *   round       the round this proposal was made in (default 1)
 *   previous    [{ round, owner, repo, target, diff: [lines], comment (what the user said about it) }]
 *   decided     { round, outcome: do|skip }  decided in an earlier round: arrives folded
 * Answer block (footer):
 *   do 1 3  skip 2           apply as proposed / drop
 *   4 ✎                      the user's version; then, each only when changed:

    { n: 1, headline: "The agent adds code nobody asked for", recurrence: 4,
      owner: "standards", repo: "acme/api", target: ".agents/rules/services.md", cost: "rework",

<script>
  const OWNERS = {
    check: "Automated check", standards: "Review standards", enforcement: "Enforcement gap", planning: "Planning skill",
    slicing: "Slicing rules", skill: "A skill", docs: "Navigation / docs / access", tooling: "Tooling",
  };
  const ALIAS = { navigation: 'docs' };
  // What the change does on the next run, per owner kind ("after" caption).
  const EFFECT = {
    check: "fails the commit before anyone reviews it", standards: "the reviewing agent flags it before you see the PR",
    enforcement: "the rule that already exists gets loaded where it applies", planning: "asked and decided before any code is written",
    slicing: "the stack is checked before it goes to review", skill: "the skill stops doing it", docs: "the agent can find it", tooling: "one command instead of many",
  };
  const OUT = { do: ['do', '✓ Do'], skip: ['skip', '✕ Skip'], revise: ['revise', '💬 Revise'] };
  const OTHER = '__other';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const $ = id => document.getElementById(id);
  const imps = DATA.themes;
  const imp = n => imps.find(i => i.n === n);
  const evOf = i => i.evidence || [];
  const recOf = i => i.recurrence ?? evOf(i).length;
  const draftOf = i => [].concat(i.diff || []).join('\n');
  const fmtAt = at => at ? new Date(at).toLocaleString('en-GB', { weekday:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const kindOf = k => ALIAS[k] || k;
  const repoList = () => (DATA.targets || []).map(r => r.repo);
  const itemsOf = repo => ((DATA.targets || []).find(r => r.repo === repo) || { items: [] }).items;
  const prevOf = i => [].concat(i.previous || []);

  const KEY = 'retro:' + DATA.id;
  let st = JSON.parse(localStorage.getItem(KEY) || '{}');
  const save = () => { localStorage.setItem(KEY, JSON.stringify(st)); footer(); summary(); };
  const S = n => (st[n] ??= {});

  // Proposed route and text, and the user's version of them.
  const orig = i => ({ owner: kindOf(i.owner), repo: i.repo || '', target: i.target || '', draft: draftOf(i) });
  const cur = i => { const s = st[i.n] || {}, o = orig(i);
    return { owner: s.owner ?? o.owner, repo: s.repo ?? o.repo, target: s.target ?? o.target, draft: s.draft ?? o.draft }; };
  const routeChanged = s => !!s && (s.owner !== undefined || s.repo !== undefined || s.target !== undefined);
  const edited = s => !!s && (routeChanged(s) || s.draft !== undefined);
  // Outcome: do | skip | revise | null (open). An earlier round's decision holds until the user changes it; 'open' = undecided on purpose.
  const outcome = i => { const v = st[i.n]?.st ?? i.decided?.outcome ?? null; return v === 'open' ? null : v; };
  const folded = i => !!outcome(i) && !st[i.n]?.open;
  const routeTxt = c => `${c.target} @ ${c.repo || '?'}`;

  let curF = Math.max(0, imps.findIndex(i => !outcome(i)));

  function header() {
    const rnd = DATA.round > 1 ? ` · round ${DATA.round}` : '';
    const total = imps.reduce((a, i) => a + recOf(i), 0);
    return `<div class="kicker">${esc(DATA.date)}${rnd} · ${total} comments and corrections → ${imps.length} themes</div>
      <h1>${esc(DATA.title)}</h1><p class="lesson">${DATA.lesson}</p>
      <div class="meta">${(DATA.sources || []).map(s => `<span><a href="${esc(s.url)}">${esc(s.ref)}</a> ${esc(s.repo)} · ${esc(s.title)}</span>`).join('')}
      <span>report: <code>${esc(DATA.report)}</code></span></div>
      <div class="sum" id="sum"></div>`;
  }
  function summary() {
    const el = $('sum'); if (!el) return;
    const c = { do: 0, skip: 0, revise: 0, open: 0 }; imps.forEach(i => c[outcome(i) || 'open']++);
    const w = k => `${c[k] / imps.length * 100}%`;
    el.innerHTML = `<span class="s-do"><b>${c.do}</b>to do</span><span class="s-skip"><b>${c.skip}</b>skipped</span>
      <span class="s-rev"><b>${c.revise}</b>to revise</span><span class="s-open"><b>${c.open}</b>open</span>
      <span class="bar"><i class="b-do" style="width:${w('do')}"></i><i class="b-rev" style="width:${w('revise')}"></i><i class="b-skip" style="width:${w('skip')}"></i></span>
      <span class="hint"><kbd>j</kbd><kbd>k</kbd> move · <kbd>d</kbd> do · <kbd>s</kbd> skip · <kbd>e</kbd> edit · <kbd>c</kbd> comment · <kbd>o</kbd> open / fold</span>`;
  }
  function filesStrip() {
    const groups = {};
    for (const i of imps) { if (outcome(i) === 'skip') continue; (groups[routeTxt(cur(i))] ??= []).push(i); }
    return `<div class="lbl">Where these changes would land · ${Object.keys(groups).length} (skipped themes left out)</div><div class="files">${Object.entries(groups).map(([w, is]) => {
      const on = is.filter(i => outcome(i) === 'do');
      return `<div class="ff ${on.length ? 'on' : ''}"><code>${esc(w)}</code><span>themes ${is.map(i => i.n).join(', ')}${on.length ? ` · <b>${on.length} to do</b>` : ''}</span></div>`; }).join('')}</div>`;
  }

  function routeEditor(i) {
    const c = cur(i), repos = repoList(), repoOther = !repos.includes(c.repo);
    const items = itemsOf(c.repo), fit = items.filter(x => (x.kinds || []).includes(c.owner)), rest = items.filter(x => !fit.includes(x));
    const tOther = !items.some(x => x.target === c.target);
    const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
    return `<div class="route" onclick="event.stopPropagation()">
      <label>Kind of fix<select data-r="owner" data-n="${i.n}">${Object.entries(OWNERS).map(([k, v]) => opt(k, v, k === c.owner)).join('')}</select></label>
      <label>Repository<select data-r="repo" data-n="${i.n}">${(DATA.targets || []).map(r => opt(r.repo, `${r.repo} · ${r.note}`, r.repo === c.repo)).join('')}${opt(OTHER, 'other…', repoOther)}</select>
        ${repoOther ? `<input class="tx" data-rt="repo" data-n="${i.n}" placeholder="org/repo" value="${esc(c.repo)}">` : ''}</label>
      <label>Target · file path, skill or rule<select data-r="target" data-n="${i.n}">
        ${fit.length ? `<optgroup label="fits ${esc(OWNERS[c.owner] || c.owner)}">${fit.map(x => opt(x.target, x.target, x.target === c.target)).join('')}</optgroup>` : ''}
        ${rest.length ? `<optgroup label="${fit.length ? 'other targets here' : 'targets in this repo'}">${rest.map(x => opt(x.target, x.target, x.target === c.target)).join('')}</optgroup>` : ''}
        ${opt(OTHER, 'other… (type it)', tOther)}</select>
        ${tOther ? `<input class="tx" data-rt="target" data-n="${i.n}" placeholder="path/to/file, skill-name or rule" value="${esc(c.target)}">` : ''}</label></div>`;
  }

  function prevBlock(i) {
    const ps = prevOf(i); if (!ps.length) return '';
    return `<div class="prev">${ps.map(p => `<div class="said"><b>Round ${(p.round || 1) + 1}</b> — you said: “${esc(p.comment)}”</div>
      <details onclick="event.stopPropagation()"><summary>Round ${p.round || 1} proposal · ${esc(OWNERS[kindOf(p.owner)] || p.owner)} · ${esc(p.target)} @ ${esc(p.repo)}</summary>
        <div class="diff old"><div class="dh"><span>${esc(p.target)} @ ${esc(p.repo)}</span><span class="k">replaced by this round's proposal</span></div>
        <pre>${[].concat(p.diff || []).map(l => `<span class="ln">${esc(l) || ' '}</span>`).join('')}</pre></div></details>`).join('')}</div>`;
  }

  function foldedRow(i, k) {
    const s = st[i.n] || {}, o = outcome(i), c = cur(i), early = i.decided && s.st === undefined && !edited(s);
    return `<section class="pair folded o-${o} ${k === curF ? 'cur' : ''}" id="p${i.n}" onclick="reopen(${i.n})" title="click to reopen and change the decision">
      <div class="frow"><span class="rk">${i.n}</span><span class="oc ${OUT[o][0]}">${OUT[o][1]}</span>${edited(s) ? '<span class="ed" title="edited">✎</span>' : ''}
        <h2>${esc(i.headline)}</h2>${(i.round || 1) > 1 ? `<span class="chip rnd">round ${i.round}</span>` : ''}${early ? `<span class="hint">decided in round ${i.decided.round || 1}</span>` : ''}
        <span class="rt">→ ${esc(routeTxt(c))}</span>
        ${o === 'revise' && s.comment ? `<span class="cq">“${esc(s.comment)}”</span>` : ''}</div></section>`;
  }

  function quote(f) {
    const on = f.on ? `<span class="re">↳ on “${esc(f.on.length > 70 ? f.on.slice(0, 70) + '…' : f.on)}”</span>` : '';
    const where = String(f.where || '').split('/').pop();
    return `<div class="bq">${on}“${esc(f.quote)}”${f.reply ? `<span class="rp">reply: ${esc(f.reply)}</span>` : ''}
      <span class="wh">${esc(f.who)}${where ? ' · ' + esc(where) : ''}${f.at ? ' · ' + fmtAt(f.at) : ''}${f.url ? ` · <a href="${esc(f.url)}" target="_blank" onclick="event.stopPropagation()">↗</a>` : ''}</span></div>`;
  }

  function openPair(i, k) {
    const s = st[i.n] || {}, fs = evOf(i), r = recOf(i), c = cur(i), o = outcome(i), showC = s.commenting || s.comment;
    return `<section class="pair ${k === curF ? 'cur' : ''} ${o ? 'o-' + o : ''}" id="p${i.n}" onclick="setCur(${k})">
      <div class="phead"><span class="rk">${i.n}</span><h2>${esc(i.headline)}</h2>
        ${(i.round || 1) > 1 ? `<span class="chip rnd">round ${i.round}</span>` : ''}
        <span class="chip ${esc(i.cost)}">${esc(i.cost)}</span><span class="chip own" id="own${i.n}">→ ${esc(OWNERS[c.owner] || c.owner)}</span>
        ${o ? `<span class="oc ${OUT[o][0]}">${OUT[o][1]}</span><button class="ghost" onclick="event.stopPropagation();fold(${i.n})" title="fold (o)">fold ▴</button>` : ''}</div>
      ${prevBlock(i)}
      <div class="split">
        <div class="before"><div class="lbl">Before · what the reviewer had to say · ${r}×${fs.length < r ? ` (${fs.length} shown)` : ''}</div><div class="ql">${fs.map(quote).join('')}</div></div>
        <div class="arrow">→</div>
        <div class="after"><div class="lbl">After · the change that would have caught it <span class="edited" id="ed${i.n}">${edited(s) ? '✎ edited' : ''}</span></div>
          ${s.editing ? routeEditor(i) : ''}
          <div class="diff"><div class="dh"><span id="dh${i.n}">${esc(routeTxt(c))}</span><span class="k">${c.owner === 'check' ? 'runs on commit' : 'read by the agent'}</span></div>
            ${s.editing ? `<textarea data-f="${i.n}" onclick="event.stopPropagation()">${esc(c.draft)}</textarea>` : `<pre>${c.draft.split('\n').map(l => `<span class="ln">${esc(l) || ' '}</span>`).join('')}</pre>`}</div>
          <p class="effect">Next run: ${esc(EFFECT[c.owner] || 'the owner changes')}. Would have saved <b>${r}</b> comment${r === 1 ? '' : 's'}.</p>
          <div class="acts"><button class="do ${o === 'do' ? 'on' : ''}" onclick="event.stopPropagation();decide(${i.n},'do')">✓ Do</button>
            <button class="skip ${o === 'skip' ? 'on' : ''}" onclick="event.stopPropagation();decide(${i.n},'skip')">✕ Skip</button>
            <button onclick="event.stopPropagation();editF(${i.n})">${s.editing ? 'Done editing' : '✎ Edit'}</button>
            <button class="cm ${o === 'revise' ? 'on' : ''}" onclick="event.stopPropagation();commentF(${i.n})">💬 Comment</button>
            ${o ? `<button class="ghost" onclick="event.stopPropagation();decide(${i.n},'open')">↺ undecide</button>` : ''}
            <span class="hint">${edited(s) ? 'any edit counts as do' : ''}</span></div>
          ${showC ? `<div class="cbox" onclick="event.stopPropagation()"><label>Note to the agent · it comes back next round with a different proposal for this theme</label>
            <textarea data-c="${i.n}" placeholder="e.g. this belongs in the planning skill's questions, not in standards · propose a lint rule instead">${esc(s.comment || '')}</textarea>
            <div class="row"><button class="cm on" onclick="sendBack(${i.n})">Send back for revision</button>
              ${s.comment && o !== 'revise' ? `<span class="warn">comment kept but not sent: the decision is ${o || 'open'}</span>` : ''}
              <span class="hint"><kbd>⌘</kbd><kbd>↵</kbd> send back · <kbd>Esc</kbd> leave</span></div></div>` : ''}
        </div></div></section>`;
  }

  function render() {
    $('m').innerHTML = header() + filesStrip() + imps.map((i, k) => folded(i) ? foldedRow(i, k) : openPair(i, k)).join('');
    bind(); summary(); footer();
  }

  function bind() {
    const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
    document.querySelectorAll('textarea[data-f]').forEach(t => {
      const n = +t.dataset.f; fit(t);
      t.oninput = () => { fit(t); const s = S(n); s.draft = t.value === orig(imp(n)).draft ? undefined : t.value; touched(n); };
      t.onkeydown = e => { if (e.key === 'Escape') editF(n); };
    });
    document.querySelectorAll('textarea[data-c]').forEach(t => {
      const n = +t.dataset.c; fit(t);
      t.oninput = () => { fit(t); const s = S(n); s.comment = t.value.trim() ? t.value : undefined;
        if (s.comment) { s.st = 'revise'; s.open = true; } else if (s.st === 'revise') s.st = undefined; save(); };
      t.onkeydown = e => { if (e.key === 'Escape') t.blur(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendBack(n); };
    });
    document.querySelectorAll('select[data-r]').forEach(el => {
      el.onchange = () => { const n = +el.dataset.n, f = el.dataset.r, i = imp(n), s = S(n);
        let v = el.value === OTHER ? '' : el.value;
        s[f] = v === orig(i)[f] ? undefined : v;
        if (f === 'repo' && v) { // pick the first target in the new repo that suits the kind
          const c = cur(i), its = itemsOf(v), t = (its.find(x => (x.kinds || []).includes(c.owner)) || its[0] || {}).target ?? '';
          s.target = t === orig(i).target ? undefined : t; }
        touched(n); render();
        if (el.value === OTHER) document.querySelector(`input[data-rt="${f}"][data-n="${n}"]`)?.focus(); };
    });
    document.querySelectorAll('input[data-rt]').forEach(el => {
      el.oninput = () => { const n = +el.dataset.n, f = el.dataset.rt, i = imp(n), s = S(n);
        s[f] = el.value === orig(i)[f] ? undefined : el.value; touched(n);
        const d = $('dh' + n); if (d) d.textContent = routeTxt(cur(i)); };
      el.onkeydown = e => { if (e.key === 'Escape' || e.key === 'Enter') el.blur(); };
    });
  }
  // Any edit approves the theme (unless it is being sent back), and keeps it open while editing.
  function touched(n) { const s = S(n);
    if (edited(s) && s.st !== 'revise') s.st = 'do';
    s.open = true; const e = $('ed' + n); if (e) e.textContent = edited(s) ? '✎ edited' : ''; save(); }

  const nextOpen = from => { for (let k = 1; k <= imps.length; k++) { const j = (from + k) % imps.length; if (!outcome(imps[j])) return j; } return from; };
  const scrollTo_ = k => $('p' + imps[k].n)?.scrollIntoView({ block:'start', behavior:'smooth' });
  window.setCur = k => { curF = k; document.querySelectorAll('.pair').forEach((p, j) => p.classList.toggle('cur', j === curF)); };
  window.decide = (n, v) => {
    const s = S(n); s.st = v; s.open = undefined; s.editing = undefined; s.commenting = undefined;
    if (v === 'revise' && !s.comment) { s.st = undefined; return commentF(n); }
    save(); curF = imps.findIndex(i => i.n === n);
    if (v !== 'open') curF = nextOpen(curF);
    render(); scrollTo_(curF);
  };
  window.sendBack = n => { if (!st[n]?.comment) return; decide(n, 'revise'); };
  window.reopen = n => { const s = S(n); s.open = true; curF = imps.findIndex(i => i.n === n); save(); render(); };
  window.fold = n => { const s = S(n); s.open = undefined; s.editing = undefined; s.commenting = undefined; save(); render(); };
  window.editF = n => { const s = S(n); s.editing = !s.editing || undefined; if (s.editing) s.open = true; save(); render();
    if (s.editing) { const t = document.querySelector(`textarea[data-f="${n}"]`); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); } };
  window.commentF = n => { const s = S(n); s.commenting = true; s.open = true; save(); render();
    const t = document.querySelector(`textarea[data-c="${n}"]`); t?.focus(); t?.scrollIntoView({ block:'center', behavior:'smooth' }); };

  function keys(e) {
    const i = imps[curF], go = k => { setCur(k); scrollTo_(k); };
    if (e.key === 'j') go(Math.min(imps.length - 1, curF + 1));
    if (e.key === 'k') go(Math.max(0, curF - 1));
    if (e.key === 'd') decide(i.n, 'do');
    if (e.key === 's') decide(i.n, 'skip');
    if (e.key === 'e') { e.preventDefault(); editF(i.n); }
    if (e.key === 'c') { e.preventDefault(); commentF(i.n); }
    if (e.key === 'o') folded(i) ? reopen(i.n) : outcome(i) && fold(i.n);
  }

  /* ---------- answer ----------
   * Line 1: "do 1 3  skip 2" (apply as proposed; drop).
   * Then per edited theme (an edit means do):
   *   "4 ✎"
   *   "  → <kind> <target> @ <repo>"      only when kind, repo or target changed
   *   "  <line>" ...                      the edited rule text, verbatim, only when the text changed
   * Then per theme sent back: '5 💬 "<note>"' = don't apply; propose something different for 5 next round.
   *   A ✎ block for the same n is the user's edit to start the new proposal from.
   * Decisions carried over from an earlier round are not repeated unless the user changed them. */
  function answer() {
    const d = [], sk = [], ed = [], cm = [];
    for (const i of imps) {
      const s = st[i.n] || {}, o = outcome(i), e = edited(s);
      if (!o || (i.decided && !e && o === i.decided.outcome)) continue;
      if (o === 'skip') { sk.push(i.n); continue; }
      if (e) { const c = cur(i); let b = `${i.n} ✎`;
        if (routeChanged(s)) b += `\n  → ${c.owner} ${c.target} @ ${c.repo || '?'}`;
        if (s.draft !== undefined) b += '\n' + s.draft.split('\n').map(l => '  ' + l).join('\n');
        ed.push(b); }
      else if (o === 'do') d.push(i.n);
      if (o === 'revise') cm.push(`${i.n} 💬 "${(s.comment || '').trim().replace(/\s*\n\s*/g, ' ').replace(/"/g, '\\"')}"`);
    }
    return [[d.length && `do ${d.join(' ')}`, sk.length && `skip ${sk.join(' ')}`].filter(Boolean).join('  '), ...ed, ...cm].filter(Boolean).join('\n');
  }

  function footer() {
    const decided = imps.filter(outcome).length;
    $('cnt').textContent = `${decided}/${imps.length} decided`;
    $('ans').dataset.hint = 'answer syntax: do 1 3  skip 2  ·  4 ✎ (→ kind target @ repo, indented rule text)  ·  5 💬 "note"';
    $('ans').textContent = answer();
  }

  $('copy').onclick = e => { navigator.clipboard.writeText($('ans').textContent);
    e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy answers', 1200); };
  addEventListener('keydown', e => {
    const t = e.target; if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    keys(e);
  });
  document.title = DATA.title;
  render();
</script>
</body>
</html>

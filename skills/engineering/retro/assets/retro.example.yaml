# retro.yaml: copy the shape, not the content. Omit optional fields that don't apply.
#   node <skill dir>/scripts/render.mjs retro.yaml [--md]   → retro.html, or the Markdown report
# Multi-line text: a block scalar (|). Quote one-line values containing ": " or " #".
# A new round: same file, new id, round + 1, round/previous on reworked themes, decided on settled ones.
id: retro-ISSUE-123-r2  # unique per retro and round
title: "Retro · acme/api #142 · partial refunds"
date: Tue 27 Oct
round: 2  # optional: proposal round, 1 for the first
lesson: The repo's conventions live only in the <b>reviewer's head</b>.  # one line; may use <b>, <code>
report: ~/.agents/retros/api/2026-10-27-refunds.md  # where the --md report is saved
sources:  # optional
  - ref: "PR #142"
    kind: pr  # pr | session
    title: Add partial refunds
    repo: acme/api  # optional
    url: "#"  # optional
targets:  # optional: owners and repos offered in the page's pickers
  - repo: acme/api
    note: the PRs' repo  # optional
    items:  # optional
      - target: .agents/rules/services.md
        kinds: [standards]  # optional: owner kinds it suits
themes:  # ranked: recurrence, then cost
  - n: 1  # rank; what answers refer to
    headline: The agent adds code nobody asked for  # what the agent does wrong, plain words
    recurrence: 2  # optional; defaults to the evidence count
    owner: standards  # check | standards | enforcement | planning | slicing | skill | docs | navigation | tooling
    repo: acme/api  # a repo from targets
    target: .agents/rules/services.md  # file, skill or rule the change lands in
    cost: rework  # redesign | rework | friction
    diff: |  # the change exactly as it lands
      ## No speculative code
      Every branch, helper and guard has a caller that needs it.
    evidence:  # optional
      - quote: Why catch the provider's 404 here?
        who: alex  # optional, and so is the rest of the item
        at: 2026-10-20T10:12:00Z
        where: app/payments/provider.py  # a file, or "PR conversation"
        url: "#"
        on: Don't wrap the client.  # the earlier comment this follows up
        reply: Removed the 404 branch.  # what the agent answered or changed
    round: 2  # optional: round proposed in; omit for round 1
    previous:  # optional: proposals this replaces
      - round: 1  # optional
        owner: docs  # optional
        repo: acme/api  # optional
        target: AGENTS.md  # optional
        diff: |  # optional
          - No speculative code.
        comment: make it a review rule  # what the user said
  - n: 2
    headline: The agent handles amounts as floats
    owner: check
    repo: acme/api
    target: .pre-commit-config.yaml
    cost: friction
    diff: |
      - id: no-float-money
        entry: 'float\('
    decided:  # optional: settled in an earlier round; arrives folded
      round: 1  # optional
      outcome: do  # do | skip

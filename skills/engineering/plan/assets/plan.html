<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --text:#e8eaee; --muted:#8b919c; --accent:#7aa2ff; --bad:#ff5c5c; --warn:#ffb547; --ok:#3ecf8e; --code:#12141a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Inter", "Segoe UI", sans-serif; }
  a { color:var(--accent); cursor:pointer; text-decoration:none; } a:hover { text-decoration:underline; }
  kbd { font:600 12px ui-monospace, monospace; background:#20242d; border-radius:6px; padding:2px 7px; color:var(--muted); }
  button { font:inherit; color:inherit; }
  .kicker { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  .muted { color:var(--muted); }
  h1 { font-size:34px; line-height:1.2; margin:10px 0 22px; }

  /* shapes: code never wraps, it scrolls inside its block */
  .code { font:13px/1.65 ui-monospace, monospace; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; max-width:100%; }
  .code > div { white-space:pre; }
  .add { color:var(--ok); } .mod { color:var(--warn); } .del { color:var(--bad); } .same { color:var(--muted); }
  .tree { display:grid; grid-template-columns:14px max-content max-content; column-gap:14px; }
  .tree .tl { display:contents; } .tree .tl > span { white-space:pre; }
  .tree .dir { color:var(--muted); } .tree .note { color:var(--muted); font-family:-apple-system, sans-serif; font-size:13px; }
  .sig { color:#c9d4ff; }
  .seq { display:block; margin:4px 0 10px; }
  .seq .pbox { fill:var(--card); stroke:var(--line); } .seq .pt { fill:var(--text); font:600 13px -apple-system, sans-serif; }
  .seq .life { stroke:var(--line); stroke-dasharray:4 4; } .seq .msg { stroke:var(--accent); fill:none; stroke-width:1.5; }
  .seq .mt { fill:#c4c8d0; font:12px ui-monospace, monospace; }
  .owns { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:15px; } .owns b { font-weight:600; }
  .states { display:grid; gap:8px; }
  .st { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:15px; }
  .st span.s { background:var(--bg); border:1px solid var(--line); padding:5px 12px; border-radius:8px; font-family:ui-monospace, monospace; font-size:13px; }
  .st span.s.bad { border-color:var(--bad); color:var(--bad); } .st span.s.good { border-color:var(--ok); color:var(--ok); }
  .st i { color:var(--muted); font-style:normal; }
  .mono { font:13px/1.7 ui-monospace, monospace; } .mono .m { color:var(--accent); font-weight:600; }
  .flow .fn { font-weight:600; font-size:17px; margin-bottom:6px; }
  .flow ol { margin:0 0 8px; padding-left:22px; } .flow li { margin:4px 0; }
  .flow .exp { color:var(--ok); } .flow .exp::before { content:"→ "; color:var(--muted); }
  .flow .err { color:var(--warn); font-size:14px; } .flow .err::before { content:"✕ "; }
  .flow .layer { display:inline-block; margin-top:6px; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .src { color:var(--muted); font-size:14px; margin-top:6px; }
  .txt p { margin:0 0 12px; font-size:19px; color:#d5d8de; } .txt p:last-child { margin-bottom:0; }
  .diff { margin-top:10px; border-color:#4a3d22; }
  .btn { background:#20242d; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover { border-color:#4a5060; } .btn.pri { background:var(--accent); color:#000; border-color:var(--accent); }
  .btn.okon { background:var(--ok); color:#000; border-color:var(--ok); }
  textarea.ed { width:100%; min-height:80px; background:var(--bg); color:var(--text); border:1px solid var(--accent); border-radius:10px; padding:10px 12px; font:13px/1.6 ui-monospace, monospace; resize:vertical; white-space:pre; overflow-x:auto; }
  textarea.ed:focus { outline:none; }
  .edbar { display:flex; gap:8px; margin-top:8px; }

  /* layout: one piece at a time + sidebar */
  .B { display:grid; grid-template-columns:minmax(0,1fr) 330px; min-height:100vh; }
  .B main { padding:40px 56px 240px; max-width:1080px; min-width:0; width:100%; }
  .B .pnav { display:flex; gap:8px; align-items:center; margin-top:28px; }
  .B .pnav .sp { flex:1; }

  /* reviewable block */
  .blk { position:relative; border:1px solid transparent; border-left:3px solid transparent; border-radius:12px; padding:14px 16px 16px; margin:0 -19px 14px; min-width:0; }
  .blk:hover { border-color:var(--line); border-left-color:var(--line); }
  .blk.focus { border-color:#343a47; border-left-color:var(--accent); background:rgba(122,162,255,.03); }
  .blk.edited { border-left-color:var(--warn); }
  .blk.noted:not(.edited) { border-left-color:var(--accent); }
  .bh { display:flex; align-items:center; gap:10px; margin-bottom:10px; min-height:28px; }
  .bh .bid { font:600 12px ui-monospace, monospace; color:var(--muted); background:#1c2028; border-radius:6px; padding:2px 7px; }
  .bh .bt { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .bh .emark { color:var(--warn); font-size:13px; }
  .bh .emark a { margin-left:6px; }
  .bh .acts { margin-left:auto; display:flex; gap:4px; opacity:.35; transition:opacity .1s; }
  .blk:hover .acts, .blk.focus .acts { opacity:1; }
  .bh .acts button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:3px 10px; font-size:13px; cursor:pointer; }
  .bh .acts button:hover { border-color:#4a5060; }
  .cmt { margin-top:12px; }
  .cmt textarea { width:100%; min-height:58px; background:rgba(122,162,255,.08); color:var(--text); border:1px solid rgba(122,162,255,.4); border-radius:10px; padding:9px 12px; font:15px/1.45 -apple-system, sans-serif; resize:vertical; }
  .cmt textarea:focus { outline:none; border-color:var(--accent); }

  /* locked decisions */
  .dq { font-size:15px; color:var(--muted); }
  .dc { font-size:22px; font-weight:600; margin:2px 0 4px; display:flex; gap:10px; align-items:baseline; }
  .dc .lock { font-size:14px; color:var(--ok); font-weight:600; }
  .dr { font-size:16px; color:#c4c8d0; }
  .dm { font-size:13px; color:var(--muted); margin-top:6px; }
  .dm b { color:var(--text); font-weight:600; }
  .lockintro { font-size:17px; color:#c4c8d0; margin:-8px 0 22px; }

  .facttxt { font-size:19px; }
  .stk { display:inline-flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 10px; margin:0 6px 6px 0; font-size:13px; }
  .stk b { color:var(--accent); }

  aside { border-left:1px solid var(--line); padding:28px 20px 240px; font-size:14px; }
  aside .what { color:var(--muted); font-size:13px; margin:8px 0 0; }
  aside h2 { margin:22px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  aside ul { padding:0; margin:0; }
  aside li { list-style:none; padding:7px 8px; border-radius:8px; cursor:pointer; display:flex; gap:8px; }
  aside li:hover { background:#14171d; }
  aside li.cur { background:var(--card); }
  aside li .i { font:600 12px ui-monospace, monospace; color:var(--muted); min-width:24px; padding-top:2px; }
  aside li .s { margin-left:auto; font:600 12px ui-monospace, monospace; white-space:nowrap; padding-top:2px; display:flex; gap:6px; }
  aside .stacks { margin-top:8px; }
  aside .keys { margin-top:24px; color:var(--muted); font-size:12px; line-height:2.1; }

  footer { position:fixed; left:0; right:0; bottom:0; background:#0b0c10ee; border-top:1px solid var(--line); padding:12px 24px; display:flex; gap:14px; align-items:center; backdrop-filter:blur(6px); z-index:20; }
  footer pre { flex:1; margin:0; max-height:84px; overflow:auto; font:13px/1.45 ui-monospace, monospace; color:var(--accent); white-space:pre-wrap; }
  footer #cnt { color:var(--muted); font-size:13px; min-width:170px; }
  footer .vb { display:flex; gap:6px; }
  footer .vb button { background:#20242d; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:600 13px -apple-system, sans-serif; cursor:pointer; }
  footer .vb button.on.ap { background:var(--ok); color:#000; border-color:var(--ok); }
  footer .vb button.on.ch { background:var(--warn); color:#000; border-color:var(--warn); }
  footer #copy { background:var(--accent); color:#000; border:0; border-radius:8px; padding:9px 16px; font:600 14px -apple-system, sans-serif; cursor:pointer; }

  @media (max-width:900px) {
    .B { grid-template-columns:1fr; } .B main { padding:28px 24px 60px; }
    aside { border-left:0; border-top:1px solid var(--line); }
    .blk { margin:0 -8px 14px; padding:12px 8px 14px 10px; }
    footer { flex-wrap:wrap; } footer #cnt { min-width:0; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa2ff"/></marker>
</defs></svg>
<div id="app"></div>
<footer><span id="cnt"></span><pre id="ans"></pre>
  <div class="vb"><button class="ap" onclick="setVerdict('approve')">Approve</button><button class="ch" onclick="setVerdict('changes')">Changes</button></div>
  <button id="copy">Copy answers</button></footer>

<script>
/* ---- Fill in DATA only. Never change the layout below. ----
 * id            unique per plan, e.g. "plan-ISSUE-123-v1"; keys the saved review state
 * ref, url      the issue or spec this plan answers
 * title         the plan's name
 * what, why     a sentence or two each
 * decisions[]   already settled in chat before this page is shown; read-only here.
 *               { id "D1", q the question that was asked, short sidebar label, choice the locked answer,
 *                 reason, settled { by who answered, when e.g. "chat, round 1" },
 *                 alts optional [choice] other options that were offered }
 * facts[]       { id "F1", text the external contract relied on, source, url primary source }
 * architecture  optional; any key may be omitted when it does not apply
 *   sequence    lines "from → to: message" (sequence diagram) and "name — what it owns"
 *   contracts   lines "METHOD /path  request → response"
 *   data        lines "+ table.field  type" / "~ table.field ..."
 *   states      lines "from → to: trigger"
 * stacks[]      { id, repo, slices ["S1","S2"] } in stack order; one repo per stack
 * slices[]      { id "S1", repo, title, delivers,
 *                 after  ids this slice merges after (same stack = stacked on; other repo = merge-order edge),
 *                 files  lines "+|~|- path — what it is responsible for",
 *                 calls  optional call-tree diff lines, first char is " ", "+" or "-", then indentation,
 *                 sigs   optional key signatures,
 *                 flows  [{ name, steps [[do, expected]], errors [..], test the layer that keeps it }] }
 * before        optional, for a revision: { blockId: the block's previous text, in the same line
 *               format } shows what changed beside the block; omit on a first plan
 * Block ids used in answers: W, D1, F1, A.flow, A.contracts, A.data, A.states,
 *                            S1.delivers, S1.files, S1.calls, S1.sigs, S1.f1
 * Piece ids (for "ok"):      W, D, F, A, S1, S2, ...
 * Answer block, one line per touched block, then the verdict:
 *   S1.files 💬 "comment"   D3 💬 "reopen: …"   W ✎ "new text"   S2.sigs ✎ + indented full text
 *   S1 ok                   approve | changes
 */
const DATA = {
  id: "plan-ISSUE-123-example",
  ref: "ISSUE-123", url: "#",
  title: "Partial refunds",
  what: "Let support refund part of a captured payment, more than once, up to the captured amount, and see each refund's status on the payment page.",
  why: "Today support can only refund in full, so a partial refund means refunding everything and charging again: the customer sees two charges and we pay the fee twice.",
  decisions: [
    { id: "D1", q: "Who can issue a partial refund?", short: "Who refunds",
      choice: "Support and admin roles only", reason: "Same roles that can issue full refunds today",
      settled: { by: "alex", when: "chat, round 1" }, alts: ["Any merchant user", "Admin only"] },
    { id: "D2", q: "Where does refund state live?", short: "Refund storage",
      choice: "New refunds table, one row per refund", reason: "Several partials per payment, each with its own status and history",
      settled: { by: "alex", when: "chat, round 1" }, alts: ["refunded_amount column on payments", "Read from the provider on demand"] },
    { id: "D3", q: "What does the payment show before the provider confirms?", short: "Status before webhook",
      choice: "Show the refund as pending until the webhook arrives", reason: "Refunds can stay pending for days (F2)",
      settled: { by: "alex", when: "chat, round 1" }, alts: ["Show refunded at once, revert on failure"] },
    { id: "D4", q: "Is there a refund window?", short: "Refund window",
      choice: "No window of our own; the provider's 180-day limit applies", reason: "The spec is silent and the provider already enforces a limit (F1); written back to the spec",
      settled: { by: "sam", when: "chat, round 2" }, alts: ["30 days from capture"] },
    { id: "D5", q: "How are double submits prevented?", short: "Idempotency",
      choice: "Client sends an idempotency key; the api stores it and forwards it to the provider", reason: "A double click or retry must never refund twice",
      settled: { by: "alex", when: "chat, round 2" }, alts: ["Disable the button while submitting"] },
  ],
  facts: [
    { id: "F1", text: "The provider's create-refund call takes an amount in minor units, allows several partial refunds until their total equals the captured amount, and rejects refunds 180 days after capture.",
      source: "Provider docs › Refunds › Create a refund", url: "#" },
    { id: "F2", text: "The provider sends refund.updated with status pending, succeeded or failed; a refund can stay pending for up to 5 business days.",
      source: "Provider docs › Webhooks › Refund events", url: "#" },
    { id: "F3", text: "api already verifies provider webhook signatures in src/webhooks/verify.ts, and new event types are registered in src/webhooks/registry.ts.",
      source: "api repo, src/webhooks/", url: "#" },
  ],
  architecture: {
    sequence: [
      "web → api: POST /payments/{id}/refunds",
      "api → api: check role + remaining amount",
      "api → provider: create refund (amount, key)",
      "provider → api: refund id, pending",
      "api → web: 201 Refund (pending)",
      "provider → api: webhook refund.updated",
      "api → api: update refund status",
      "web — refund dialog and refund history on the payment page",
      "api — refunds table, refund endpoint, webhook handler",
      "provider — moves the money, reports status by webhook",
    ],
    contracts: [
      "POST /payments/{id}/refunds  { amountMinor, reason?, idempotencyKey } → 201 Refund | 403 | 422 refund_exceeds_remaining",
      "GET  /payments/{id}/refunds  → 200 Refund[]",
      "Refund = { id, amountMinor, currency, status, reason, createdBy, createdAt }",
      "Payment += { refundedMinor }",
      "event refund.updated (provider → api)  { refund_id, status }",
    ],
    data: [
      "+ refunds  id, payment_id → payments, amount_minor int, currency, status, reason",
      "+ refunds  provider_refund_id unique, idempotency_key unique, created_by, created_at",
      "+ index refunds(payment_id)",
    ],
    states: [
      "pending → succeeded: refund.updated (succeeded)",
      "pending → failed: refund.updated (failed); amount is refundable again",
    ],
  },
  stacks: [
    { id: "api/refunds", repo: "api", slices: ["S1", "S2"] },
    { id: "web/refunds", repo: "web", slices: ["S3", "S4"] },
  ],
  slices: [
    { id: "S1", repo: "api", title: "Partial refund endpoint", after: [],
      delivers: "Tracer bullet. Support can refund part of a payment through POST /payments/{id}/refunds; the refund is saved as pending and the payment reports refundedMinor.",
      files: [
        "+ api/migrations/0042_create_refunds.sql — refunds table, unique provider id and idempotency key",
        "+ api/src/refunds/routes.ts — POST and GET handlers, role check",
        "+ api/src/refunds/service.ts — createRefund: remaining-amount check, provider call, persist",
        "+ api/src/refunds/repo.ts — refunds table queries",
        "~ api/src/provider/client.ts — add createRefund(amount, key)",
        "~ api/src/payments/serializer.ts — add refundedMinor",
        "+ api/test/refunds.test.ts — endpoint tests against the provider stub",
      ],
      calls: [
        "  POST /payments/:id/refunds → refundsRoutes.create",
        "+   requireRole([\"support\", \"admin\"])",
        "+   refundService.createRefund(paymentId, input, user)",
        "+     refundsRepo.findByIdempotencyKey(key)",
        "+     assertRefundable(payment, refundedMinor, amountMinor)",
        "+     provider.createRefund(payment.providerId, amountMinor, key)",
        "+     refundsRepo.insert({ status: \"pending\", ... })",
      ],
      sigs: [
        "createRefund(paymentId: string, input: { amountMinor: number; reason?: string; idempotencyKey: string }, user: User): Promise<Refund>",
        "assertRefundable(payment: Payment, refundedMinor: number, amountMinor: number): void  // throws RefundExceedsRemaining",
      ],
      flows: [
        { name: "Partial refund is created",
          steps: [["As support, POST 30.00 on a captured 100.00 payment", "201, status pending, payment refundedMinor 3000"],
                  ["POST again with the same idempotency key", "200, the same refund; the provider stub was called once"]],
          errors: ["70.01 after that → 422 refund_exceeds_remaining", "merchant user → 403"],
          test: "api integration test, provider stubbed" },
      ] },
    { id: "S2", repo: "api", title: "Refund status from webhook", after: ["S1"],
      delivers: "A refund moves to succeeded or failed when the provider's refund.updated arrives; a failed refund makes its amount refundable again.",
      files: [
        "+ api/src/webhooks/handlers/refund-updated.ts — maps provider status, updates the row",
        "~ api/src/webhooks/registry.ts — register refund.updated",
        "~ api/src/refunds/repo.ts — updateStatusByProviderId",
        "+ api/test/webhooks/refund-updated.test.ts — signed event fixtures",
      ],
      calls: [
        "  POST /webhooks/provider → webhookRoutes.receive",
        "    verifySignature(req)",
        "    registry.dispatch(event)",
        "+     onRefundUpdated(event)",
        "+       refundsRepo.updateStatusByProviderId(refundId, status)",
      ],
      sigs: [
        "type RefundStatus = \"pending\" | \"succeeded\" | \"failed\"",
        "onRefundUpdated(event: ProviderEvent<\"refund.updated\">): Promise<void>",
      ],
      flows: [
        { name: "Webhook settles a refund",
          steps: [["Send a signed refund.updated (succeeded) for a pending refund", "row status succeeded"],
                  ["Replay the same event", "200, no change"]],
          errors: ["unknown provider refund id → 200, logged, no row changed", "bad signature → 401"],
          test: "api integration test" },
        { name: "Failed refund frees the amount",
          steps: [["Send refund.updated (failed) for a 30.00 pending refund", "status failed, payment refundedMinor back to 0"]],
          errors: [],
          test: "api integration test" },
      ] },
    { id: "S3", repo: "web", title: "Refund dialog", after: ["S1"],
      delivers: "Support opens Refund on a payment, enters an amount up to what is left, and sees the refund as pending.",
      files: [
        "+ web/src/payments/RefundDialog.tsx — amount input, remaining hint, submit",
        "+ web/src/api/refunds.ts — createRefund client; one idempotency key per dialog open",
        "~ web/src/payments/PaymentPage.tsx — Refund button for support and admin",
        "+ web/src/payments/RefundDialog.test.tsx — component test, api mocked",
      ],
      calls: [
        "  PaymentPage",
        "+   RefundButton → open RefundDialog",
        "+     submit → api.createRefund(paymentId, body)",
        "+     onSuccess → invalidate payment query",
      ],
      sigs: [
        "createRefund(paymentId: string, body: { amountMinor: number; reason?: string; idempotencyKey: string }): Promise<Refund>",
      ],
      flows: [
        { name: "Refund part of a payment",
          steps: [["Open a captured 100.00 payment as support, click Refund", "dialog shows \"up to 100.00\""],
                  ["Enter 30.00 and submit", "dialog closes; payment shows \"Refund 30.00 · pending\""],
                  ["Double-click submit", "one refund created"]],
          errors: ["120.00 → inline error, submit disabled", "merchant user → no Refund button"],
          test: "component test, api mocked" },
      ] },
    { id: "S4", repo: "web", title: "Refund history", after: ["S3", "S2"],
      delivers: "The payment page lists its refunds with their status and the amount still refundable.",
      files: [
        "+ web/src/payments/RefundHistory.tsx — rows with amount, status, who, when",
        "~ web/src/api/refunds.ts — listRefunds",
        "~ web/src/payments/PaymentPage.tsx — render RefundHistory under the summary",
        "+ web/src/payments/RefundHistory.test.tsx — component test, api mocked",
      ],
      sigs: [
        "listRefunds(paymentId: string): Promise<Refund[]>",
      ],
      flows: [
        { name: "History shows statuses",
          steps: [["Open a 100.00 payment with a succeeded 30.00 and a pending 20.00 refund", "two rows with amounts and statuses; \"50.00 left to refund\""],
                  ["Open a payment with a failed refund", "row marked failed; its amount counts as refundable"]],
          errors: ["list call fails → payment page still renders, history shows a retry"],
          test: "component test, api mocked" },
      ] },
  ],
};
</script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const AR = DATA.architecture;
const stackOf = id => DATA.stacks.find(k => k.slices.includes(id));
const repos = [...new Set(DATA.slices.map(s => s.repo))];

/* ---- pieces (one per screen) and blocks (each individually commentable / editable) ---- */
const PIECES = [], BL = {}, ORDER = [];
function piece(id, kind, title, label, group, extra = {}) { PIECES.push({ id, kind, title, label, group, blocks: [], ...extra }); }
function add(id, kind, raw, title, extra = {}) { const p = PIECES.at(-1); BL[id] = { id, kind, raw, title, piece: p.id, ...extra }; p.blocks.push(id); ORDER.push(id); }
const flowRaw = f => [f.name, ...f.steps.map((s, i) => `${i + 1}. ${s[0]} → ${s[1]}`), ...f.errors.map(e => `error: ${e}`), `test: ${f.test}`].join('\n');

piece('W', 'what', DATA.title, 'What and why', 'Plan');
add('W', 'text', DATA.what + '\n\n' + DATA.why, 'What and why');
piece('D', 'dec', 'Locked decisions', 'Locked decisions', 'Plan');
DATA.decisions.forEach(d => add(d.id, 'dec', `${d.choice} — ${d.reason}`, d.short || d.q, { d, locked: true }));
piece('F', 'facts', 'Facts this plan relies on', 'Facts', 'Plan');
DATA.facts.forEach(f => add(f.id, 'fact', `${f.text} — ${f.source}`, 'Fact', { f }));
if (AR) {
  piece('A', 'arch', 'Architecture', 'Architecture', 'Plan');
  [['A.flow', 'seq', 'Components and flow', AR.sequence], ['A.contracts', 'contracts', 'Contracts', AR.contracts],
   ['A.data', 'data', 'Data', AR.data], ['A.states', 'states', 'States', AR.states]]
    .forEach(([id, k, t, ls]) => ls && add(id, k, ls.join('\n'), t));
}
DATA.slices.forEach(s => {
  piece(s.id, 'slice', s.title, s.title, 'Slices', { s });
  add(s.id + '.delivers', 'lead', s.delivers, 'Delivers');
  add(s.id + '.files', 'files', s.files.join('\n'), 'File tree diff');
  if (s.calls) add(s.id + '.calls', 'calls', s.calls.join('\n'), 'Call tree diff');
  if (s.sigs) add(s.id + '.sigs', 'sigs', s.sigs.join('\n'), 'Signatures');
  s.flows.forEach((f, i) => add(`${s.id}.f${i + 1}`, 'flow', flowRaw(f), `Flow ${i + 1} · how it is checked`));
});
const PI = Object.fromEntries(PIECES.map((p, i) => [p.id, i]));

/* ---- state ---- */
let st, UI;
const key = () => `plan:${DATA.id}`;
function load() {
  st = JSON.parse(localStorage.getItem(key()) || '{}');
  for (const k of ['edits', 'notes', 'ok']) st[k] ??= {};
  st.cur = Math.min(PIECES.length - 1, Math.max(0, st.cur ?? 0));
  UI = { editing: null, diff: {}, focus: null };
}
function save() { localStorage.setItem(key(), JSON.stringify(st)); footer(); }
const cur = id => st.edits[id] ?? BL[id].raw;
const hasNote = id => !!st.notes[id]?.trim();
const isEd = id => st.edits[id] !== undefined;

/* ---- renderers: raw text -> html (same raw formats as the editor shows) ---- */
const lines = raw => raw.split('\n').filter(l => l.trim());
const RENDER = {
  text: raw => `<div class="txt">${raw.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('')}</div>`,
  lead: raw => `<div class="txt"><p>${esc(raw)}</p></div>`,
  dec: (raw, b) => { const d = b.d;
    return `<div class="dq">${esc(d.q)}</div><div class="dc">${esc(d.choice)}<span class="lock">🔒 locked</span></div><div class="dr">${esc(d.reason)}</div>
      <div class="dm">settled by <b>${esc(d.settled?.by)}</b> · ${esc(d.settled?.when)}${d.alts?.length ? ` · also offered: ${d.alts.map(esc).join(' · ')}` : ''}</div>`; },
  fact: (raw, b) => { const i = raw.lastIndexOf(' — '); const t = i < 0 ? raw : raw.slice(0, i), s = i < 0 ? '' : raw.slice(i + 3);
    return `<div class="facttxt">${esc(t)}</div>${s ? `<div class="src">source: <a href="${esc(b.f.url)}" target="_blank">${esc(s)}</a></div>` : ''}`; },
  seq: raw => {
    const ls = lines(raw), msgs = [], owns = [];
    for (const l of ls) { let m = l.match(/^\s*(.+?)\s*→\s*(.+?)\s*:\s*(.*)$/); if (m) { msgs.push({ f: m[1], t: m[2], m: m[3] }); continue; }
      m = l.match(/^\s*(.+?)\s*—\s*(.*)$/); if (m) owns.push(m); }
    const ps = []; msgs.forEach(x => [x.f, x.t].forEach(p => ps.includes(p) || ps.push(p)));
    const cw = 230, top = 42, rh = 36, W = Math.max(1, ps.length) * cw, H = top + msgs.length * rh + 12, X = p => ps.indexOf(p) * cw + cw / 2;
    let s = `<svg class="seq" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
    ps.forEach(p => s += `<line class="life" x1="${X(p)}" y1="30" x2="${X(p)}" y2="${H}"/><rect class="pbox" x="${X(p) - 60}" y="4" width="120" height="26" rx="6"/><text class="pt" x="${X(p)}" y="22" text-anchor="middle">${esc(p)}</text>`);
    msgs.forEach((x, i) => { const y = top + i * rh + 18, x1 = X(x.f), x2 = X(x.t);
      s += x1 === x2
        ? `<path class="msg" d="M${x1} ${y - 7} h26 v12 h-22" marker-end="url(#ah)"/><text class="mt" x="${x1 + 34}" y="${y + 3}">${esc(x.m)}</text>`
        : `<line class="msg" x1="${x1}" y1="${y}" x2="${x2 + (x2 > x1 ? -3 : 3)}" y2="${y}" marker-end="url(#ah)"/><text class="mt" x="${(x1 + x2) / 2}" y="${y - 6}" text-anchor="middle">${esc(x.m)}</text>`; });
    return s + `</svg>` + (owns.length ? `<div class="owns">${owns.map(m => `<b>${esc(m[1])}</b><span class="muted">${esc(m[2])}</span>`).join('')}</div>` : '');
  },
  contracts: raw => `<div class="code mono">${lines(raw).map(l => { const m = l.match(/^(GET|POST|PUT|PATCH|DELETE|event)(\s+)(.*)$/);
    return `<div>${m ? `<span class="m">${m[1]}</span>${m[2]}${esc(m[3])}` : esc(l)}</div>`; }).join('')}</div>`,
  data: raw => `<div class="code mono">${lines(raw).map(l => `<div class="${{ '+': 'add', '~': 'mod', '-': 'del' }[l[0]] || ''}">${esc(l)}</div>`).join('')}</div>`,
  states: raw => `<div class="states">${lines(raw).map(l => { const m = l.match(/^\s*(.+?)\s*→\s*(.+?)\s*:\s*(.*)$/); if (!m) return `<div>${esc(l)}</div>`;
    const cls = t => /fail/.test(t) ? 'bad' : /succe/.test(t) ? 'good' : '';
    return `<div class="st"><span class="s ${cls(m[1])}">${esc(m[1])}</span><i>→</i><span class="s ${cls(m[2])}">${esc(m[2])}</span><span class="muted">${esc(m[3])}</span></div>`; }).join('')}</div>`,
  files: raw => {
    const fs = lines(raw).map(l => { const m = l.match(/^([+~-])\s+(\S+)\s*(?:—\s*(.*))?$/); return m ? { op: m[1], path: m[2], note: m[3] || '' } : { op: '', path: l.trim(), note: '' }; })
      .sort((a, b) => a.path.localeCompare(b.path));
    const seen = new Set(), out = [];
    for (const f of fs) {
      const parts = f.path.split('/');
      parts.slice(0, -1).forEach((p, i) => { const d = parts.slice(0, i + 1).join('/');
        if (!seen.has(d)) { seen.add(d); out.push(`<div class="tl"><span></span><span class="dir" style="padding-left:${i * 16}px">${esc(p)}/</span><span></span></div>`); } });
      const c = { '+': 'add', '~': 'mod', '-': 'del' }[f.op] || '';
      out.push(`<div class="tl"><span class="${c}">${f.op}</span><span class="${c}" style="padding-left:${(parts.length - 1) * 16}px">${esc(parts.at(-1))}</span><span class="note">${esc(f.note)}</span></div>`);
    }
    return `<div class="code tree">${out.join('')}</div>`;
  },
  calls: raw => `<div class="code">${raw.split('\n').map(l => `<div class="${{ '+': 'add', '-': 'del', '~': 'mod' }[l[0]] || 'same'}">${esc(l) || ' '}</div>`).join('')}</div>`,
  sigs: raw => `<div class="code">${lines(raw).map(l => `<div class="sig">${esc(l)}</div>`).join('')}</div>`,
  flow: raw => {
    const ls = lines(raw), name = ls[0] || '', steps = [], errs = [], other = []; let test = '';
    for (const l of ls.slice(1)) { let m;
      if ((m = l.match(/^\d+\.\s*(.*?)\s*→\s*(.*)$/))) steps.push(m.slice(1));
      else if ((m = l.match(/^error:\s*(.*)$/i))) errs.push(m[1]);
      else if ((m = l.match(/^test:\s*(.*)$/i))) test = m[1];
      else other.push(l); }
    return `<div class="flow"><div class="fn">${esc(name)}</div><ol>${steps.map(s => `<li>${esc(s[0])} <span class="exp">${esc(s[1])}</span></li>`).join('')}</ol>
      ${other.map(o => `<div>${esc(o)}</div>`).join('')}${errs.map(e => `<div class="err">${esc(e)}</div>`).join('')}${test ? `<span class="layer">test: ${esc(test)}</span>` : ''}</div>`;
  },
};
const show = id => RENDER[BL[id].kind](cur(id), BL[id]);

/* ---- line diff (LCS) for the edited-block marker ---- */
function ldiff(a, b) {
  a = a.split('\n'); b = b.split('\n');
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push([' ', a[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', a[i++]]); else out.push(['+', b[j++]]); }
  while (i < n) out.push(['-', a[i++]]); while (j < m) out.push(['+', b[j++]]);
  return out;
}
const diffHtml = (id, a = BL[id].raw, b = st.edits[id]) => `<div class="code diff">${ldiff(a, b).map(([o, t]) => `<div class="${o === '+' ? 'add' : o === '-' ? 'del' : 'same'}">${o} ${esc(t)}</div>`).join('')}</div>`;

/* ---- one block ---- */
function block(id) {
  const b = BL[id], ed = isEd(id), editing = UI.editing === id, note = st.notes[id], prev = DATA.before?.[id];
  const mark = prev !== undefined && !ed && !editing ? `<span class="emark" style="color:var(--accent)">revised <a onclick="event.stopPropagation();toggleDiff('${id}')">${UI.diff[id] ? 'hide' : 'show'} what changed</a></span>`
    : ed && !editing ? `<span class="emark">✎ edited <a onclick="event.stopPropagation();toggleDiff('${id}')">${UI.diff[id] ? 'hide' : 'show'} diff</a><a onclick="event.stopPropagation();revertEdit('${id}')">revert</a></span>` : '';
  const acts = editing ? '' : `<span class="acts">${b.locked ? '' : `<button title="e" onclick="event.stopPropagation();startEdit('${id}')">✎ edit</button>`}<button title="c" onclick="event.stopPropagation();comment('${id}')">💬 ${b.locked ? 'comment / reopen' : 'comment'}</button></span>`;
  const body = editing
    ? `<textarea class="ed" id="ed-${id}" spellcheck="false" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')saveEdit('${id}');if(event.key==='Escape')cancelEdit()">${esc(cur(id))}</textarea>
       <div class="edbar"><button class="btn pri" onclick="saveEdit('${id}')">Save ⌘↵</button><button class="btn" onclick="cancelEdit()">Cancel</button>${ed ? `<button class="btn" onclick="revertEdit('${id}')">Revert to original</button>` : ''}</div>`
    : show(id) + (UI.diff[id] ? (ed ? diffHtml(id) : prev !== undefined ? diffHtml(id, prev, b.raw) : '') : '');
  const cmt = note !== undefined ? `<div class="cmt"><textarea id="c-${id}" placeholder="${b.locked ? `Comment on ${id}, or "reopen: …"` : `Comment on ${id}…`}"
      oninput="setNote('${id}',this.value)" onblur="blurNote('${id}')" onkeydown="if(event.key==='Escape')this.blur()">${esc(note)}</textarea></div>` : '';
  return `<section class="blk ${ed ? 'edited' : ''} ${hasNote(id) ? 'noted' : ''} ${UI.focus === id ? 'focus' : ''}" id="b-${id}" onclick="focusBlk('${id}')">
    <div class="bh"><span class="bid">${id}</span><span class="bt">${esc(b.title)}</span>${mark}${acts}</div>${body}${cmt}</section>`;
}

/* ---- piece page ---- */
function counts(p) { return { e: p.blocks.filter(isEd).length, c: p.blocks.filter(hasNote).length }; }
function status(p) {
  const { e, c } = counts(p);
  if (e || c) return (e ? `<span style="color:var(--warn)">✎${e}</span>` : '') + (c ? `<span style="color:var(--accent)">💬${c}</span>` : '');
  return st.ok[p.id] ? '<span style="color:var(--ok)">ok</span>' : '';
}
const stacksHtml = () => DATA.stacks.map(k => `<span class="stk"><b>${esc(k.repo)}</b>${k.slices.join(' → ')}</span>`).join('') +
  DATA.slices.flatMap(s => (s.after || []).filter(a => stackOf(a) !== stackOf(s.id)).map(a => `<span class="stk"><b>${a}</b>⇢ ${s.id}<span class="muted">merge first</span></span>`)).join('');

function render() {
  const p = PIECES[st.cur];
  const kick = p.kind === 'slice'
    ? (() => { const k = stackOf(p.id); return `${p.id} · ${esc(p.s.repo)} · stack ${esc(k.id)} ${k.slices.indexOf(p.id) + 1}/${k.slices.length}${p.s.after.length ? ' · after ' + p.s.after.join(', ') : ''}`; })()
    : p.kind === 'what' ? `Plan for approval · <a href="${esc(DATA.url)}">${esc(DATA.ref)}</a> · ${repos.join(' + ')}` : esc(p.label);
  const intro = p.kind === 'dec' ? `<p class="lockintro">Settled with you in chat before this plan was drawn. The plan below is built on them. Comment on one to reopen it.</p>` : '';
  const groups = [...new Set(PIECES.map(x => x.group))];
  $('app').innerHTML = `<div class="B"><main>
    <div class="kicker">${kick} · ${st.cur + 1} of ${PIECES.length}</div><h1>${esc(p.title)}</h1>${intro}
    ${p.blocks.map(block).join('')}
    <div class="pnav">${st.cur > 0 ? `<button class="btn" onclick="go(${st.cur - 1})">← ${esc(PIECES[st.cur - 1].label)}</button>` : ''}<span class="sp"></span>
      <button class="btn ${st.ok[p.id] ? 'okon' : ''}" onclick="okPiece()">✓ ${p.id} ok <kbd>o</kbd></button>
      ${st.cur < PIECES.length - 1 ? `<button class="btn pri" onclick="go(${st.cur + 1})">${esc(PIECES[st.cur + 1].label)} →</button>` : ''}</div>
  </main><aside>
    <div class="kicker">Plan · ${esc(DATA.ref)}</div><div style="font-size:18px;font-weight:600;margin-top:4px">${esc(DATA.title)}</div><p class="what">${esc(DATA.what)}</p>
    ${groups.map(g => `<h2>${g}</h2>${g === 'Slices' ? `<div class="stacks">${stacksHtml()}</div>` : ''}<ul>${PIECES.map((x, i) => x.group !== g ? '' :
      `<li class="${i === st.cur ? 'cur' : ''}" onclick="go(${i})"><span class="i">${x.id}</span>${esc(x.label)}<span class="s">${status(x)}</span></li>`).join('')}</ul>`).join('')}
    <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> next/prev piece · <kbd>↓</kbd>/<kbd>↑</kbd> move between blocks<br>
      <kbd>e</kbd> edit block · <kbd>c</kbd> comment block · <kbd>o</kbd> piece ok<br><kbd>⌘↵</kbd> save edit · <kbd>Esc</kbd> cancel</div>
  </aside></div>`;
  document.querySelectorAll('textarea.ed').forEach(t => { t.style.height = Math.min(t.scrollHeight + 4, 520) + 'px'; });
  footer();
}

/* ---- actions ---- */
window.go = i => { if (i >= 0 && i < PIECES.length) { st.cur = i; UI.focus = null; UI.editing = null; save(); render(); scrollTo(0, 0); } };
window.focusBlk = id => { UI.focus = id; document.querySelectorAll('.blk.focus').forEach(e => e.classList.remove('focus')); $('b-' + id)?.classList.add('focus'); };
window.okPiece = () => { const id = PIECES[st.cur].id; if (st.ok[id]) delete st.ok[id]; else st.ok[id] = true; save(); render(); };
window.startEdit = id => { if (BL[id].locked) return; UI.focus = id; UI.editing = id; render(); const t = $('ed-' + id); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } };
window.saveEdit = id => { const v = $('ed-' + id).value.replace(/\s+$/, ''); if (v === BL[id].raw) delete st.edits[id]; else st.edits[id] = v; UI.editing = null; save(); render(); };
window.cancelEdit = () => { UI.editing = null; render(); };
window.revertEdit = id => { delete st.edits[id]; UI.editing = null; save(); render(); };
window.toggleDiff = id => { UI.diff[id] = !UI.diff[id]; render(); };
window.comment = id => { UI.focus = id; st.notes[id] ??= ''; render(); $('c-' + id)?.focus(); };
window.setNote = (id, v) => { st.notes[id] = v; save(); refreshSide(); };
window.blurNote = id => { if (!st.notes[id]?.trim()) { delete st.notes[id]; save(); setTimeout(render); } };
function refreshSide() {
  document.querySelectorAll('aside li').forEach((li, i) => { li.querySelector('.s').innerHTML = status(PIECES[i]); });
  const b = $('b-' + UI.focus); if (b) b.classList.toggle('noted', hasNote(UI.focus));
}

/* ---- answer block ----
 * one line per touched block, in plan order:
 *   ID 💬 "comment"            (decisions: D3 💬 "reopen: …")
 *   ID ✎ "new text"            single-line block
 *   ID ✎                       multi-line block, followed by its full new text, indented
 *   S1 ok                      a piece accepted with no comments or edits
 * then the verdict: approve | changes
 */
function answer() {
  const out = []; let nE = 0, nC = 0, nP = 0;
  for (const p of PIECES) {
    const touched = p.blocks.filter(id => isEd(id) || hasNote(id));
    for (const id of touched) {
      if (isEd(id)) { nE++; const v = st.edits[id];
        out.push(v.includes('\n') || BL[id].raw.includes('\n') ? `${id} ✎\n` + v.split('\n').map(l => '  ' + l).join('\n') : `${id} ✎ "${v}"`); }
      if (hasNote(id)) { nC++; out.push(`${id} 💬 "${st.notes[id].trim().replace(/\n+/g, ' ')}"`); }
    }
    if (!touched.length && st.ok[p.id]) out.push(`${p.id} ok`);
    if (touched.length || st.ok[p.id]) nP++;
  }
  return { text: out.join('\n'), count: `${nP}/${PIECES.length} pieces · ${nE} edits · ${nC} comments` };
}
function footer() {
  const { text, count } = answer();
  $('ans').textContent = [text, st.verdict].filter(Boolean).join('\n') || 'Nothing yet. Comment or edit any block, mark pieces ok, then Approve or Changes.';
  $('cnt').textContent = count + (st.verdict ? '' : ' · no verdict');
  document.querySelector('.vb .ap').classList.toggle('on', st.verdict === 'approve');
  document.querySelector('.vb .ch').classList.toggle('on', st.verdict === 'changes');
}
window.setVerdict = v => { st.verdict = st.verdict === v ? undefined : v; save(); };
$('copy').onclick = e => {
  navigator.clipboard.writeText($('ans').textContent);
  e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy answers', 1200);
};

/* ---- keys ---- */
addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches?.('input, textarea, select, [contenteditable], [contenteditable] *')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const blocks = PIECES[st.cur].blocks, i = blocks.indexOf(UI.focus);
  const move = d => { const id = blocks[i < 0 ? (d > 0 ? 0 : blocks.length - 1) : Math.max(0, Math.min(blocks.length - 1, i + d))];
    focusBlk(id); $('b-' + id).scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  if (e.key === 'j') go(st.cur + 1);
  else if (e.key === 'k') go(st.cur - 1);
  else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'o') okPiece();
  else if (e.key === 'e' && UI.focus) { e.preventDefault(); startEdit(UI.focus); }
  else if (e.key === 'c' && UI.focus) { e.preventDefault(); comment(UI.focus); }
  else if (e.key === 'Escape') { if (UI.editing) cancelEdit(); else { UI.focus = null; document.querySelectorAll('.blk.focus').forEach(x => x.classList.remove('focus')); } }
});

load();
document.title = `${DATA.title} · plan`;
render();
</script>
</body>
</html>

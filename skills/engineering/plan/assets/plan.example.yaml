# plan.yaml: the plan's data, written once. Copy this shape, not this content.
#   node <plan skill dir>/scripts/render.mjs plan.yaml        → plan.html, the review page
#   node <plan skill dir>/scripts/render.mjs plan.yaml --md   → the Markdown plan that gets saved
# Leave out any optional field that does not apply. Multi-line text goes in a
# block scalar (|), written as it should read. Quote a one-line value that
# contains ": " or " #".
# Ids in the user's answers: blocks W, D1, F1, A.flow, A.contracts, A.data,
# A.states, S1.delivers, S1.files, S1.calls, S1.sigs, S1.f1 (flow 1);
# pieces W, D, F, A, S1, S2… for "S1 ok".

id: plan-ISSUE-123-v1          # unique per round; a revised plan gets a new id. Keys the page's saved answers
ref: ISSUE-123                 # the issue or spec this plan answers
url: "#"                       # optional: its link
title: Partial refunds
what: >-                       # a sentence or two
  Let support refund part of a captured payment, more than once, up to the
  captured amount, and see each refund's status on the payment page.
why: >-                        # a sentence or two
  Today support can only refund in full, so a partial refund means refunding
  everything and charging again: the customer sees two charges and we pay the fee twice.

decisions:                     # settled in chat before the plan is drawn; the page shows them locked
  - id: D1
    q: Who can issue a partial refund?      # the question as it was asked
    short: Who refunds                      # optional: sidebar label
    choice: Support and admin roles only    # the answer
    reason: Same roles that can issue full refunds today
    settled:                                # optional: who answered, and where
      by: alex
      when: chat, round 1
    alts: [Any merchant user, Admin only]   # optional: the other options offered
  - id: D2
    q: Where does refund state live?
    short: Refund storage
    choice: New refunds table, one row per refund
    reason: Several partials per payment, each with its own status and history
    settled:
      by: alex
      when: chat, round 1
    alts: [refunded_amount column on payments, Read from the provider on demand]
  - id: D3
    q: What does the payment show before the provider confirms?
    short: Status before webhook
    choice: Show the refund as pending until the webhook arrives
    reason: Refunds can stay pending for days (F2)
    settled:
      by: alex
      when: chat, round 1
    alts: ["Show refunded at once, revert on failure"]
  - id: D4
    q: Is there a refund window?
    short: Refund window
    choice: No window of our own; the provider's 180-day limit applies
    reason: The spec is silent and the provider already enforces a limit (F1); written back to the spec
    settled:
      by: sam
      when: chat, round 2
    alts: [30 days from capture]
  - id: D5
    q: How are double submits prevented?
    short: Idempotency
    choice: Client sends an idempotency key; the api stores it and forwards it to the provider
    reason: A double click or retry must never refund twice
    settled:
      by: alex
      when: chat, round 2
    alts: [Disable the button while submitting]

facts:                         # each external contract a slice relies on, with its primary source
  - id: F1
    text: >-
      The provider's create-refund call takes an amount in minor units, allows
      several partial refunds until their total equals the captured amount, and
      rejects refunds 180 days after capture.
    source: Provider docs › Refunds › Create a refund
    url: "#"                   # optional
  - id: F2
    text: >-
      The provider sends refund.updated with status pending, succeeded or failed;
      a refund can stay pending for up to 5 business days.
    source: Provider docs › Webhooks › Refund events
    url: "#"
  - id: F3
    text: >-
      api already verifies provider webhook signatures in src/webhooks/verify.ts,
      and new event types are registered in src/webhooks/registry.ts.
    source: api repo, src/webhooks/
    url: "#"

architecture:                  # optional, and so is each part
  sequence: |                  # "from → to: message" lines draw the diagram; "name — what it owns" lines list owners
    web → api: POST /payments/{id}/refunds
    api → api: check role + remaining amount
    api → provider: create refund (amount, key)
    provider → api: refund id, pending
    api → web: 201 Refund (pending)
    provider → api: webhook refund.updated
    api → api: update refund status
    web — refund dialog and refund history on the payment page
    api — refunds table, refund endpoint, webhook handler
    provider — moves the money, reports status by webhook
  contracts: |                 # "METHOD /path  request → response", types, "event name (from → to)  payload"
    POST /payments/{id}/refunds  { amountMinor, reason?, idempotencyKey } → 201 Refund | 403 | 422 refund_exceeds_remaining
    GET  /payments/{id}/refunds  → 200 Refund[]
    Refund = { id, amountMinor, currency, status, reason, createdBy, createdAt }
    Payment += { refundedMinor }
    event refund.updated (provider → api)  { refund_id, status }
  data: |                      # "+ new", "~ changed", "- removed" tables, fields and indexes
    + refunds  id, payment_id → payments, amount_minor int, currency, status, reason
    + refunds  provider_refund_id unique, idempotency_key unique, created_by, created_at
    + index refunds(payment_id)
  states: |                    # "from → to: trigger"
    pending → succeeded: refund.updated (succeeded)
    pending → failed: refund.updated (failed); amount is refundable again

stacks:                        # in stack order; one repo per stack, every slice in exactly one
  - id: api/refunds
    repo: api
    slices: [S1, S2]
  - id: web/refunds
    repo: web
    slices: [S3, S4]

slices:
  - id: S1
    repo: api
    title: Partial refund endpoint
    after: []                  # ids it merges after: in its stack = stacked on, another repo = merge-order edge
    delivers: >-
      Tracer bullet. Support can refund part of a payment through POST
      /payments/{id}/refunds; the refund is saved as pending and the payment
      reports refundedMinor.
    files: |                   # file-tree diff: "+|~|- path — what it is responsible for"
      + api/migrations/0042_create_refunds.sql — refunds table, unique provider id and idempotency key
      + api/src/refunds/routes.ts — POST and GET handlers, role check
      + api/src/refunds/service.ts — createRefund: remaining-amount check, provider call, persist
      + api/src/refunds/repo.ts — refunds table queries
      ~ api/src/provider/client.ts — add createRefund(amount, key)
      ~ api/src/payments/serializer.ts — add refundedMinor
      + api/test/refunds.test.ts — endpoint tests against the provider stub
    calls: |                   # optional call-tree diff: first column " ", "+" or "-", then the nesting
        POST /payments/:id/refunds → refundsRoutes.create
      +   requireRole(["support", "admin"])
      +   refundService.createRefund(paymentId, input, user)
      +     refundsRepo.findByIdempotencyKey(key)
      +     assertRefundable(payment, refundedMinor, amountMinor)
      +     provider.createRefund(payment.providerId, amountMinor, key)
      +     refundsRepo.insert({ status: "pending", ... })
    sigs: |                    # optional: the key new signatures a builder might get wrong
      createRefund(paymentId: string, input: { amountMinor: number; reason?: string; idempotencyKey: string }, user: User): Promise<Refund>
      assertRefundable(payment: Payment, refundedMinor: number, amountMinor: number): void  // throws RefundExceedsRemaining
    flows:                     # how the slice is checked
      - name: Partial refund is created
        steps:                 # what to do, and what should happen
          - do: As support, POST 30.00 on a captured 100.00 payment
            expect: 201, status pending, payment refundedMinor 3000
          - do: POST again with the same idempotency key
            expect: 200, the same refund; the provider stub was called once
        errors:                # optional: error cases and their result
          - 70.01 after that → 422 refund_exceeds_remaining
          - merchant user → 403
        test: api integration test, provider stubbed   # the test layer that keeps it

  - id: S2
    repo: api
    title: Refund status from webhook
    after: [S1]
    delivers: >-
      A refund moves to succeeded or failed when the provider's refund.updated
      arrives; a failed refund makes its amount refundable again.
    files: |
      + api/src/webhooks/handlers/refund-updated.ts — maps provider status, updates the row
      ~ api/src/webhooks/registry.ts — register refund.updated
      ~ api/src/refunds/repo.ts — updateStatusByProviderId
      + api/test/webhooks/refund-updated.test.ts — signed event fixtures
    calls: |
        POST /webhooks/provider → webhookRoutes.receive
          verifySignature(req)
          registry.dispatch(event)
      +     onRefundUpdated(event)
      +       refundsRepo.updateStatusByProviderId(refundId, status)
    sigs: |
      type RefundStatus = "pending" | "succeeded" | "failed"
      onRefundUpdated(event: ProviderEvent<"refund.updated">): Promise<void>
    flows:
      - name: Webhook settles a refund
        steps:
          - do: Send a signed refund.updated (succeeded) for a pending refund
            expect: row status succeeded
          - do: Replay the same event
            expect: 200, no change
        errors:
          - unknown provider refund id → 200, logged, no row changed
          - bad signature → 401
        test: api integration test
      - name: Failed refund frees the amount
        steps:
          - do: Send refund.updated (failed) for a 30.00 pending refund
            expect: status failed, payment refundedMinor back to 0
        test: api integration test

  - id: S3
    repo: web
    title: Refund dialog
    after: [S1]
    delivers: Support opens Refund on a payment, enters an amount up to what is left, and sees the refund as pending.
    files: |
      + web/src/payments/RefundDialog.tsx — amount input, remaining hint, submit
      + web/src/api/refunds.ts — createRefund client; one idempotency key per dialog open
      ~ web/src/payments/PaymentPage.tsx — Refund button for support and admin
      + web/src/payments/RefundDialog.test.tsx — component test, api mocked
    calls: |
        PaymentPage
      +   RefundButton → open RefundDialog
      +     submit → api.createRefund(paymentId, body)
      +     onSuccess → invalidate payment query
    sigs: |
      createRefund(paymentId: string, body: { amountMinor: number; reason?: string; idempotencyKey: string }): Promise<Refund>
    flows:
      - name: Refund part of a payment
        steps:
          - do: Open a captured 100.00 payment as support, click Refund
            expect: dialog shows "up to 100.00"
          - do: Enter 30.00 and submit
            expect: "dialog closes; payment shows \"Refund 30.00 · pending\""
          - do: Double-click submit
            expect: one refund created
        errors:
          - 120.00 → inline error, submit disabled
          - merchant user → no Refund button
        test: component test, api mocked

  - id: S4
    repo: web
    title: Refund history
    after: [S3, S2]
    delivers: The payment page lists its refunds with their status and the amount still refundable.
    files: |
      + web/src/payments/RefundHistory.tsx — rows with amount, status, who, when
      ~ web/src/api/refunds.ts — listRefunds
      ~ web/src/payments/PaymentPage.tsx — render RefundHistory under the summary
      + web/src/payments/RefundHistory.test.tsx — component test, api mocked
    sigs: |
      listRefunds(paymentId: string): Promise<Refund[]>
    flows:
      - name: History shows statuses
        steps:
          - do: Open a 100.00 payment with a succeeded 30.00 and a pending 20.00 refund
            expect: two rows with amounts and statuses; "50.00 left to refund"
          - do: Open a payment with a failed refund
            expect: row marked failed; its amount counts as refundable
        errors:
          - list call fails → payment page still renders, history shows a retry
        test: component test, api mocked

# before: only on a revised plan, and only for the blocks this round changed:
# the block's previous text, in the same format, keyed by block id.
# before:
#   S1.files: |
#     + api/src/refunds/routes.ts — POST handler, role check
#   D3: Show refunded at once, revert on failure — simpler UI

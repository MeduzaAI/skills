# plan.yaml: copy the shape, not the content. Omit optional fields that don't apply.
#   node <skill dir>/scripts/render.mjs plan.yaml [--md]   → plan.html, or the Markdown plan
# Multi-line text: a block scalar (|). Quote one-line values containing ": " or " #".
id: plan-ISSUE-123-v1  # unique per round; a revised plan gets a new id
ref: ISSUE-123  # the issue or spec answered
url: "#"  # optional
title: Partial refunds
what: Let support refund part of a captured payment.  # a sentence or two
why: Today that means refunding in full and charging again.
decisions:  # optional: settled in chat; shown locked
  - id: D1
    q: Who can refund?  # the question as asked
    short: Who refunds  # optional: sidebar label
    choice: Support and admin only
    reason: Same roles as full refunds
    settled:  # optional
      by: alex  # optional
      when: chat, round 1  # optional
    alts: [Any merchant user]  # optional: other options offered
facts:  # optional: external contracts relied on
  - id: F1
    text: The provider allows partial refunds up to the captured amount.
    source: Provider docs, Refunds  # primary source
    url: "#"  # optional
architecture:  # optional, each part too
  sequence: |  # "from → to: message"; "name — what it owns"
    web → api: POST /payments/{id}/refunds
    api — refunds table and endpoint
  contracts: |  # "METHOD /path  request → response", types, events
    POST /payments/{id}/refunds  { amountMinor, idempotencyKey } → 201 Refund | 422
  data: |  # "+ new", "~ changed", "- removed" tables, fields, indexes
    + refunds  id, payment_id → payments, amount_minor int, status
  states: |  # "from → to: trigger"
    pending → succeeded: refund.updated
stacks:  # one repo each; every slice in exactly one, in order
  - id: api/refunds
    repo: api
    slices: [S1]
slices:
  - id: S1
    repo: api
    title: Partial refund endpoint
    delivers: Support refunds part of a payment; saved as pending.
    after: []  # optional: slice ids it merges after
    files: |  # "+|~|- path — responsibility"
      + api/src/refunds/routes.ts — POST handler
      ~ api/src/provider/client.ts — add createRefund
    calls: |  # optional call-tree diff: first column " ", "+" or "-"
        POST /payments/:id/refunds → routes.create
      +   refundService.createRefund(paymentId, input)
    sigs: |  # optional: key new signatures
      createRefund(paymentId: string, input: RefundInput): Promise<Refund>
    flows:  # optional: how the slice is checked
      - name: Partial refund is created
        steps:
          - do: POST 30.00 on a captured 100.00 payment
            expect: 201, status pending
        errors:  # optional: case → result
          - over the remaining amount → 422
        test: api integration test  # the test layer that keeps it
before:  # optional, revised plan only: old text of changed blocks
  S1.files: |  # block ids: W, D1, F1, A.flow|contracts|data|states, S1.delivers|files|calls|sigs|f1
    + api/src/refunds/routes.ts — POST handler
